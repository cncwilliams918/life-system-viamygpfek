// this is the real fallback: fetch the version marker with cache explicitly disabled

      if(v&&v!==PAGE_VERSION){

    }).catch(function(){});

<body>

<style>
/* ============================================================
   PALETTE — every color in the app is one of these roles.
   To re-theme: edit only this block. Everything below reads
   roles (--surface, --accent, --on-ground…), never raw hex.
   The <meta name="theme-color"> tag in <head> can't read CSS
   variables, so it must be updated by hand to match --ground.
   ============================================================ */
:root{
  /* ground: the page itself — warm cream. Cards sit ON it and run lighter still,
     which is the inverse of how this app used to work: the deep greens are no
     longer what a block is made of, they're chrome (see --ink). */
  --ground:#f4efe3;              /* cream */
  --on-ground:#051f20;           /* darkest green — text on the ground */
  --on-ground-outline:rgba(5,31,32,.42);
  --on-ground-wash:rgba(5,31,32,.07);
  --on-ground-negative:#9c4a36;
  --on-ground-negative-wash:rgba(156,74,54,.12);

  /* surface: cards. Lifted by shadow, never outlined, so the three tones must
     stay distinguishable: a card is lightest, a control inside it darker, a
     field darker still. */
  --surface:#fffdf7;             /* every card */
  --surface-2:#efe8d8;           /* inset within a card: buttons, table head/total rows */
  --surface-3:#e7dfd0;           /* deepest: form fields */
  --surface-wash:rgba(5,31,32,.06);
  --on-surface:#051f20;          /* primary text on a card */
  --on-surface-dim:rgba(5,31,32,.66);
  --on-surface-faint:rgba(5,31,32,.44);
  --divider:rgba(5,31,32,.10);   /* shown through grid/flex gaps, never as a border */
  /* Depth is always two layers: a tight contact shadow that pins the card to the
     ground, and a wide soft one that does the floating. A single blur asked to
     do both jobs reads as a grey smear rather than height. The offsets are
     negative-spread so the shadow stays under the card instead of haloing it. */
  --cardshadow:0 1px 2px rgba(5,31,32,.05), 0 6px 16px -4px rgba(5,31,32,.10);
  --cardshadow-lg:0 2px 4px rgba(5,31,32,.05), 0 14px 30px -8px rgba(5,31,32,.13);
  --badgeshadow:0 1px 2px rgba(5,31,32,.06), 0 4px 10px -3px rgba(5,31,32,.12);

  /* ink: the deep greens, now reserved for chrome — the nav bar and the banners
     that have to read as a different layer from the page. */
  --ink:#163832;
  --ink-2:#0b2b26;
  --on-ink:#daf1de;
  --on-ink-dim:rgba(218,241,222,.72);
  --on-ink-faint:rgba(218,241,222,.50);

  /* accent: gold leads every action. 2 and 3 are the alternates that carry data
     series — deep green and terracotta, both readable on a light card. */
  --accent:#c9a45c;              /* gold */
  --accent-2:#235347;            /* deep green */
  --accent-3:#b96f5a;            /* terracotta */
  --accent-wash:rgba(201,164,92,.20);
  --accent-lift:#d9ba7c;         /* the lit top edge of a gold gradient */
  --on-accent:#051f20;           /* gold is light — dark ink on it, not white */

  /* status — the board's palette can't signal good/bad on its own, and these now
     sit on LIGHT cards, so they run dark rather than pastel. */
  --positive:#2f7d5b;
  --negative:#9c4a36;
  --negative-wash:rgba(156,74,54,.12);

  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --label:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{background:var(--ground);margin:0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
/* The ground is one flat mint. Sections used to alternate mint/sage with the
   color change acting as the divider; that banding is gone, so spacing and the
   section headers do the separating instead. */
.band{margin:0 calc(50% - 50vw);padding:10px calc(50vw - 50%)}
/* bottom padding clears the fixed .bottomnav so the last card is never trapped under it */
#app{color:var(--on-surface);font-family:var(--sans);line-height:1.5;max-width:920px;margin:0 auto;padding:8px 16px 108px}
#app *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app h1,#app h2,#app h3{margin:0;font-weight:600;letter-spacing:-.01em}
/* Playfair carries the display voice; Inter does all the work */
#app h1,.datemain,.fcbig,.stat .sv{font-family:var(--display);font-weight:600;letter-spacing:0}
#app p{margin:0}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation}
.plusicon{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.15em;margin-right:.3em;background-color:currentColor;
  -webkit-mask:url(Images/Plus.png?v=2) center/contain no-repeat;mask:url(Images/Plus.png?v=2) center/contain no-repeat}
button:active{transform:scale(1.08)}
input,textarea,select{background:var(--surface-3);border:none;color:var(--on-surface);border-radius:12px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 2px var(--ac,var(--accent))}
input[type=time],input[type=date]{color-scheme:light;font-family:var(--label);font-size:13px}
input::placeholder,textarea::placeholder{color:var(--on-surface-faint);opacity:1}
input[type=checkbox]{width:auto;accent-color:var(--ac,var(--accent))}
textarea{resize:vertical;min-height:52px}
.brand{font-family:var(--label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-surface-dim)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 14px}
/* Only the PNGs' alpha is used, so their own color is irrelevant. Without mask
   support the fill would paint as a solid square — blank it instead. */
@supports not ((-webkit-mask-image:url(#i)) or (mask-image:url(#i))){
  .plusicon{background-color:transparent}
}
.settingsbtn{flex:none;width:40px;height:40px;border-radius:12px;background:none;color:var(--on-ground);display:flex;align-items:center;justify-content:center}
.settingsbtn:hover{background:var(--on-ground-wash)}
.settingsbtn svg{width:22px;height:22px;fill:currentColor}
/* Settings is a popover, not a page — it blurs and dims whatever's behind it. */
.settingsoverlay{position:fixed;inset:0;background:rgba(5,31,32,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.settingscard{background:var(--surface);border-radius:22px;padding:20px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 18px 50px rgba(5,31,32,.28)}
.settingscard.wide{max-width:460px}
.settingshead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.settingshead h3{font-size:18px;font-weight:600;color:var(--on-surface)}
.settingsclose{width:32px;height:32px;border-radius:10px;color:var(--on-surface-faint);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.settingsclose:hover{background:var(--surface-2);color:var(--on-surface)}
.settingsnote{font-size:12.5px;color:var(--on-surface-faint);margin-bottom:16px;line-height:1.5}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0}
.setrow+.setrow{border-top:none}
.setlbl{display:flex;flex-direction:column;gap:2px}
.setlbl span{font-size:14px;color:var(--on-surface);font-weight:600}
.setlbl small{font-size:11.5px;color:var(--on-surface-faint)}
.setrow select{width:auto;flex:none;background:var(--surface-2);font-size:13px;padding:8px 10px}
.setrange{width:120px;flex:none;accent-color:var(--accent)}
/* toggle switch */
.swtch{width:44px;height:26px;border-radius:999px;background:var(--surface-3);flex:none;position:relative;padding:0;transition:background .15s}
.swtch:before{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--on-surface-faint);transition:transform .15s,background .15s}
.swtch.on{background:var(--accent-wash)}
.swtch.on:before{transform:translateX(18px);background:var(--accent)}
.hrow{display:flex;align-items:baseline;gap:12px;padding:16px 2px 4px;flex-wrap:wrap}
.hrow h1{font-size:23px}
.sub2{font-size:13px;color:var(--on-surface-dim);padding:0 2px 8px}
.ph{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;padding-bottom:2px}
.ph h3{font-size:14px;font-family:var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--on-surface-dim);font-weight:500}
.ph.sechead{cursor:pointer;user-select:none}
.ph .sectoggle{margin-left:auto;font-family:var(--label);font-size:19px;color:var(--on-surface-dim)}
.tempty{font-family:var(--label);font-size:12px;color:var(--on-surface-dim);padding:8px 0}
.blockaddbtn{font-family:var(--label);font-size:12.5px;font-weight:500;background:var(--surface-2);border-radius:12px;padding:11px 0;color:var(--on-surface);width:100%;letter-spacing:.01em}
.blockaddbtn:hover{background:var(--accent-wash)}
.blockaddbtn.spaced{margin-bottom:14px}
/* the one call to action on a page gets the gold */
/* The gradient is lit top to bottom so the button reads as a raised surface.
   Its shadow stays neutral rather than gold — a gold shadow under a gold button
   is a halo, and that's the look we took off the Add button on purpose. */
.blockaddbtn.primary{background:linear-gradient(180deg,var(--accent-lift),var(--accent));
  color:var(--on-accent);font-weight:600;font-size:13.5px;padding:13px 0;
  box-shadow:0 1px 2px rgba(5,31,32,.08), 0 6px 14px -5px rgba(5,31,32,.30)}
.blockaddbtn.primary:hover{opacity:.92}

.fincard{border-radius:20px;background:var(--surface);padding:16px;margin-top:14px;box-shadow:var(--cardshadow)}
.fincard h3{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-faint);font-weight:500;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld label{display:block;font-size:12px;color:var(--on-surface-dim);margin-bottom:4px}
/* "exactly / at least / at most" — a target is a floor or a ceiling as often
   as it's a number, and this is the smallest place to say which */
.kindbtn{font-family:var(--label);font-size:11px;line-height:1;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--on-surface-dim);margin-left:5px;vertical-align:middle}
.kindbtn.set{background:var(--accent);color:var(--on-accent);font-weight:600}
.fld input{font-family:var(--label);font-size:14px}
.fld .hint{font-size:11px;color:var(--on-surface-faint);margin-top:3px}
.sysfoot{margin:16px 0 0;padding-top:14px;display:flex;gap:8px;flex-wrap:wrap;font-family:var(--label);font-size:11px}
.sysfoot .undo,.sysfoot .exp,.sysfoot .imp,.sysfoot .rst{font-family:var(--label);font-size:11px;border-radius:12px;padding:6px 12px;color:var(--on-surface-dim);background:var(--surface-2)}
.sysfoot .undo.dis{opacity:.35;cursor:default}
.sysfoot .rst{color:var(--on-surface-faint)}
.sysfoot .rst:hover,.sysfoot .rst.arm{color:var(--negative)}
.sysfoot .rst.arm{background:var(--negative-wash)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{border-radius:16px;padding:13px 14px;background:var(--surface);box-shadow:var(--cardshadow)}
.stat .sl{font-family:var(--label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-faint)}
.stat .sv{font-family:var(--label);font-size:17px;margin-top:5px;font-variant-numeric:tabular-nums}
.stat.good .sv{color:var(--positive)}.stat.bad .sv{color:var(--negative)}.stat.neu .sv{color:var(--on-surface)}
@media(max-width:680px){.fgrid,.statrow{grid-template-columns:1fr}}
/* health */
.wchart{margin-top:14px;border-radius:20px;padding:14px 16px 12px;background:var(--surface);box-shadow:var(--cardshadow)}
.wchart.empty{padding:14px 16px 16px}
.wchead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.wchead h3{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-faint);font-weight:500}
.wcnow{font-family:var(--label);font-size:14px;color:var(--on-surface);font-variant-numeric:tabular-nums;white-space:nowrap}
.wcdelta{font-size:11px;color:var(--on-surface-faint);margin-left:7px}
.wcempty{font-family:var(--label);font-size:12px;color:var(--on-surface-faint);padding:14px 0 4px;text-align:center}
/* The plot is a fixed-height band that stretches to any width. Its SVG carries
   only the gridlines and the curve; every dot and every label is HTML on top,
   because the viewBox is stretched horizontally — text smears in there and a
   circle comes out an ellipse. Percentages mirror the plot's own scales. */
.wcplot{display:flex;gap:8px;align-items:stretch}
.wcyax{flex:none;display:flex;flex-direction:column;justify-content:space-between;
  font-family:var(--label);font-size:9.5px;color:var(--on-surface-faint);
  font-variant-numeric:tabular-nums;text-align:right;padding:1px 0}
.wcbody{position:relative;flex:1 1 auto;min-width:0;height:168px}
.wcbody svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wcdot{position:absolute;width:7px;height:7px;border-radius:50%;margin:-3.5px 0 0 -3.5px;
  background:var(--surface);border:2px solid currentColor;box-sizing:border-box}
/* the newest reading is the one you came to read — it gets filled in */
.wcdot.last{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:currentColor}
.wxaxis{position:relative;height:13px;margin-top:7px}
.wxaxis span{position:absolute;top:0;font-family:var(--label);font-size:10px;color:var(--on-surface-faint);white-space:nowrap}
/* the read-out strip under the plot — average, and the two ends of the range */
.wcstats{display:flex;align-items:center;gap:14px;margin-top:12px;padding:11px 14px;
  border-radius:14px;background:var(--surface-2)}
.wcstaticon{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:currentColor}
.wcstaticon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wcstat{flex:1 1 0;min-width:0}
.wcstat .wsl{font-family:var(--label);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--on-surface-faint);display:block;margin-bottom:2px}
.wcstat .wsv{font-family:var(--label);font-size:14.5px;color:var(--on-surface);font-variant-numeric:tabular-nums;white-space:nowrap}
.wcstat .wsd{font-size:10.5px;color:var(--accent-2);margin-left:5px}
.wcfoot{font-family:var(--label);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-surface-faint);text-align:right;margin-top:8px;opacity:.75}
@media(max-width:420px){
  .wcstats{gap:9px;padding:10px}
  .wcstaticon{display:none}
  .wcstat .wsv{font-size:13px}
  .wcstat .wsd{display:block;margin-left:0}
}
.hdel{color:var(--on-surface-faint);font-size:15px;cursor:pointer;text-align:center}
.hdel:hover{color:var(--negative)}
.pdlist{display:flex;flex-direction:column;gap:5px}
.pdrow{display:flex;gap:12px;align-items:baseline;font-family:var(--label);font-size:11.5px;color:var(--on-surface-dim);padding:7px 10px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.pddate{color:var(--on-surface);min-width:100px}
.pdn{margin-left:auto;color:var(--on-surface-faint)}
/* foods */
.fcard{border-radius:18px;background:var(--surface);padding:12px 14px;margin-bottom:7px;box-shadow:var(--cardshadow)}
.fctop{display:flex;align-items:center;gap:10px;cursor:pointer}
.fccaret{color:var(--on-surface-faint);font-size:18px;flex:none;width:16px}
.fcmini{font-family:var(--label);font-size:12px;color:var(--on-surface-faint);flex:none}
.fcname{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--on-surface);flex:1;min-width:0;overflow-wrap:anywhere}
.fcbase{display:block;font-family:var(--label);font-size:11px;color:var(--on-surface-faint);margin-top:2px}
.fdel{color:var(--on-surface-faint);font-size:17px;cursor:pointer;line-height:1;flex:none}
.fdel:hover{color:var(--negative)}
.fcmodetog{display:flex;gap:6px;margin-top:9px}
.fcmodebtn{font-family:var(--label);font-size:11px;background:var(--surface-2);border-radius:999px;padding:5px 13px;color:var(--on-surface-dim);flex:none}
.fcmodebtn.on{background:var(--accent);color:var(--on-accent)}
.fcrow{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.fclbl{font-family:var(--label);font-size:11px;color:var(--on-surface-faint)}
.fcrow input{width:70px;font-family:var(--label);font-size:13px;padding:6px 8px}
.fcrow select{width:auto;font-family:var(--label);font-size:12px;padding:6px 8px}
.fcunit2{font-family:var(--label);font-size:11px;color:var(--on-surface-dim)}
.fcout{margin-top:9px}
.fcbig{font-family:var(--label);font-size:26px;font-weight:600;color:var(--on-surface);line-height:1;font-variant-numeric:tabular-nums}
.fcbig .fcunit{font-size:12px;font-weight:400;color:var(--on-surface-dim);margin-left:7px}
.fcmacros{display:flex;align-items:center;gap:12px;margin-top:7px;font-family:var(--label);font-size:12px;color:var(--on-surface-dim);flex-wrap:wrap}
.fcmacros .on{color:var(--accent-2);font-weight:600}
.fcnote{margin-top:9px;font-family:var(--label);font-size:11.5px;color:var(--on-surface-faint)}
.fcnote.warn{color:var(--negative)}
.foodadd{border-radius:16px;padding:12px;background:var(--surface);margin-bottom:18px}
.foodadd>input{font-size:13px;margin-bottom:9px}
.scanbtn{font-family:var(--label);font-size:12px;background:var(--accent);border-radius:12px;padding:9px 0;color:var(--on-accent);font-weight:600;width:100%;margin-bottom:9px}
.scanoverlay{position:fixed;inset:0;background:rgba(28,28,28,.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.scanbox{background:var(--surface);border-radius:24px;padding:16px;max-width:360px;width:100%}
.scanhead{display:flex;align-items:center;justify-content:space-between;font-family:var(--label);font-size:13px;color:var(--on-surface);margin-bottom:10px}
.scanhead button{font-size:20px;line-height:1;color:var(--on-surface-faint);width:auto}
.scanhead button:hover{color:var(--negative)}
#reader{border-radius:16px;overflow:hidden;background:#000}
.scanhint{font-family:var(--label);font-size:12px;color:var(--on-surface-dim);margin-top:10px;text-align:center}
.fdbsearchrow{display:flex;gap:6px;margin-bottom:9px}
.fdbsearchrow input{flex:1;font-size:13px}
.fdbsearchrow button{font-family:var(--label);font-size:12px;background:var(--accent);border-radius:12px;padding:0 14px;color:var(--on-accent);font-weight:600;white-space:nowrap;flex:none;width:auto}
.fdbnote{font-family:var(--label);font-size:12px;color:var(--on-surface-dim);padding:8px 2px;margin-bottom:9px}
.fdbresults{display:flex;flex-direction:column;gap:5px;margin-bottom:9px;max-height:220px;overflow-y:auto}
.fdbresult{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:9px 11px;text-align:left;width:100%}
.fdbresult:hover{background:var(--surface-3)}
.fdbname{font-size:13px;color:var(--on-surface);min-width:0;overflow-wrap:anywhere}
.fdbbrand{font-family:var(--label);font-size:11px;color:var(--on-surface-faint)}
.fdbcal{font-family:var(--label);font-size:11px;color:var(--on-surface-dim);flex:none;white-space:nowrap}
.foodgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.foodgrid label{font-family:var(--label);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--on-surface-faint);display:flex;flex-direction:column;gap:4px}
.foodgrid input,.foodgrid select{font-family:var(--label);font-size:13px;padding:6px 8px}
.foodadd>button{font-family:var(--label);font-size:13px;background:var(--accent);border-radius:12px;padding:9px 0;color:var(--on-accent);font-weight:600;width:100%;margin-top:10px}
@media(max-width:860px){.foodgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.foodgrid{grid-template-columns:repeat(2,1fr)}}
.flogbtn{font-family:var(--label);font-size:11px;background:var(--accent);border-radius:999px;padding:4px 13px;color:var(--on-accent);font-weight:600;margin-left:auto}
.foodsearch{font-size:13px;margin-bottom:11px}
.derived{background:var(--surface-2);color:var(--on-surface-dim);cursor:default}
/* food sheet — 1px flex gaps stand in for the row rules */
.fsheet{border-radius:16px;overflow:hidden;box-shadow:var(--cardshadow);display:flex;flex-direction:column;gap:1px;background:var(--divider)}
.fsrow{display:grid;grid-template-columns:1fr 58px 52px 52px 52px 20px;gap:6px;align-items:center;padding:8px 10px;font-family:var(--label);font-size:12px;color:var(--on-surface);background:var(--surface)}
.fsrow>span:not(.fsname):not(.fsdel){text-align:right;font-variant-numeric:tabular-nums}
.fshead{background:var(--surface-2);color:var(--on-surface-faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.fsname{font-family:var(--sans);font-size:13px;display:flex;align-items:baseline;gap:7px;min-width:0}
.fsg{font-family:var(--label);font-size:10.5px;color:var(--on-surface-faint);flex:none}
.fsdel{color:var(--on-surface-faint);font-size:14px;cursor:pointer;text-align:center}
.fsdel:hover{color:var(--negative)}
.fstot{background:var(--surface-2);color:var(--accent-2)}
.fstot>span:first-child{font-family:var(--label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-faint)}
.fsparent .fsname{font-weight:600;color:var(--on-surface)}
.fsparent{background:var(--surface-2)}
.fschild .fsname{padding-left:16px;position:relative;color:var(--on-surface-dim)}
.fschild .fsname:before{content:'└';position:absolute;left:4px;color:var(--on-surface-faint);font-family:var(--label)}
/* meals */
.mealadd{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.mealadd input{font-size:13px}
.mealadd button{font-family:var(--label);font-size:13px;border-radius:12px;padding:0 15px;color:var(--on-surface-dim);white-space:nowrap}
.mlcard{border-radius:18px;background:var(--surface);padding:14px 16px;margin-bottom:12px}
.mltop{display:flex;align-items:center;gap:10px;cursor:pointer}
.mlcaret{color:var(--on-surface-faint);font-size:18px;flex:none;width:16px}
.mlmini{font-family:var(--label);font-size:12px;color:var(--on-surface-faint);flex:none}
.mlname{font-size:15px;font-weight:600;color:var(--on-surface);flex:1;cursor:text}
.mlmult{display:flex;align-items:center;gap:5px}
.mlmult label{font-family:var(--label);font-size:13px;color:var(--on-surface-faint)}
.mlmult input{width:66px;font-family:var(--label);font-size:13px;padding:4px 7px;text-align:center}
.mldel{color:var(--on-surface-faint);font-size:15px;cursor:pointer;line-height:1}
.mldel:hover{color:var(--negative)}
.mitems{margin-top:12px;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:1px;background:var(--divider)}
.mitem{display:grid;grid-template-columns:1fr 84px 50px 44px 44px 44px 18px;gap:6px;align-items:center;padding:7px 10px;font-family:var(--label);font-size:12px;background:var(--surface)}
.mitem>span:not(.miname):not(.midel){text-align:right;font-variant-numeric:tabular-nums}
.mihead{background:var(--surface-2);color:var(--on-surface-faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.mitot{background:var(--surface-2);color:var(--accent-2)}
.mitot>span:first-child{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-faint)}
.miname{font-family:var(--sans);font-size:13px;color:var(--on-surface);display:flex;align-items:baseline;gap:7px;min-width:0;text-align:left;padding:0}
.miname:hover,.miname:hover .calcchev{color:var(--accent-2)}
.miqty{font-family:var(--label);font-size:11px;color:var(--accent-2)}
.midel{color:var(--on-surface-faint);font-size:14px;cursor:pointer;text-align:center}
.midel:hover{color:var(--negative)}
.mitem.gone .miname{color:var(--negative);font-style:italic}
.mlfoot{display:flex;align-items:center;gap:10px;margin-top:11px}
.miadd{width:auto;flex:1;max-width:230px;font-family:var(--label);font-size:12px;padding:5px 8px}
.minofoods{font-family:var(--label);font-size:11.5px;color:var(--on-surface-faint);flex:1}
.mllog{font-family:var(--label);font-size:12px;background:var(--accent);border-radius:999px;padding:6px 15px;color:var(--on-accent);font-weight:600;white-space:nowrap;margin-left:auto}
.mllog:hover{background:var(--accent-wash)}
@media(max-width:680px){
  /* mihead/mitem/mitot all share the same 7-cell shape (name/total, needed,
     cal, p, c, f, delete) — every row must place them identically or the
     header and totals drift out of alignment with the actual item rows. The
     name is a button and the rest are spans, so this can't select by tag. */
  .mitem{grid-template-columns:1fr 36px 34px 34px 34px 18px;gap:5px}
  .mitem>:first-child{grid-column:1/-1}
}
/* macro donut */
/* No card of its own — the depth belongs to the ring, which casts its own
   shadow onto whatever it's sitting on. */
.piewrap{display:flex;align-items:center;gap:22px;margin-top:16px;padding-top:15px;flex-wrap:wrap}
.pie{flex:none;width:132px}
.pie svg{width:100%;height:auto;display:block}
.pietot{font-family:var(--sans);font-size:21px;font-weight:600;fill:var(--on-surface)}
.pietotl{font-family:var(--label);font-size:9px;letter-spacing:.14em;text-transform:uppercase;fill:var(--on-surface-faint)}
.pielegend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:7px}
.plrow{display:grid;grid-template-columns:11px 1fr auto auto;gap:9px;align-items:center;font-family:var(--label);font-size:12px}
.plsw{width:11px;height:11px;border-radius:50%}
.pln{font-family:var(--sans);font-size:13px;color:var(--on-surface)}
.plv{color:var(--on-surface-dim);font-variant-numeric:tabular-nums}
.plp{color:var(--on-surface-faint);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.piecap{font-size:11.5px;color:var(--on-surface-faint);line-height:1.5;margin-top:3px}
@media(max-width:680px){.piewrap{gap:16px}.pie{width:112px}}
@media(max-width:680px){.fsrow{grid-template-columns:1fr 46px 40px 40px 40px 18px;gap:4px;font-size:11px;padding:7px 8px}.fsname{font-size:12px}}
/* ── bottom nav — the app is five pages now, and this is its spine.
   Fixed, so #app carries matching bottom padding; both overlays sit at
   z-index 999 and must stay above it. ── */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;align-items:flex-start;gap:2px;
  background:var(--ink);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0}
/* The bar's shadow is a real gradient rather than a blur: it starts dark where
   the bar meets the page and fades out going up. A box-shadow can't be tuned
   that far — it either stops too abruptly or grimes the whole screen. */
/* drop-shadow, not a pseudo-element. The overlay this replaces was absolutely
   positioned while the buttons are static, so it painted OVER the Add button —
   tinting exactly the 12px that stick up past the bar and stopping dead at the
   bar's edge, which is why that button changed shading at the taskbar line. It
   was also a straight rectangle against a rounded bar, so it filled in the
   corners where the page should show through the bevel. A filter follows the
   real silhouette and paints behind the element instead of over its children. */
.bottomnav{filter:drop-shadow(0 -2px 4px rgba(5,31,32,.13)) drop-shadow(0 -9px 18px rgba(5,31,32,.20))}
.navbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;color:var(--on-ink-faint)}
.navbtn.on{color:var(--accent)}
.navicon{display:flex;align-items:center;justify-content:center;width:44px;height:26px;border-radius:999px;transition:background .15s}
.navbtn.on .navicon{background:var(--accent-wash)}
.navicon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navlab{font-family:var(--label);font-size:9.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
/* the one action worth a raised button of its own */
/* it still sits proud of the bar, so it keeps a plain drop shadow — dark and
   short, reading as height rather than the gold halo it used to throw */
.navfab{flex:none;width:54px;height:54px;border-radius:50%;margin:-20px 6px 0;
  /* Lit from the top-left across the whole face, same light as the macro ring.
     A sheen concentrated at the top instead faded out around 55% of the height
     — which is almost exactly where the bar's edge crosses the button, so the
     falloff read as the button changing style at the taskbar line. Spanning the
     full circle leaves no boundary for the edge to coincide with.
     The stops ease out to zero at the far corner rather than reaching it early:
     where a gradient flattens abruptly the eye reads a Mach band, and that drew
     a visible seam straight across the button. */
  background:linear-gradient(145deg,
      rgba(255,255,255,.50) 0%, rgba(255,255,255,.34) 22%,
      rgba(255,255,255,.17) 46%, rgba(255,255,255,.06) 70%,
      rgba(255,255,255,0) 100%),
    linear-gradient(180deg,var(--accent-lift),var(--accent));
  color:var(--on-accent);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(5,31,32,.22), 0 8px 18px -4px rgba(5,31,32,.38)}
/* on its own page it drops the lift and sits flush in the bar, keeping only the
   highlight. An inset shadow was the first attempt at "pressed", but on a gold
   circle it just reads as a smudge across the top. */
.navfab.on{box-shadow:none}
.navfab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
/* ── today's goal bars — the "how much room is left" HUD ── */
.goalbars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:2px;box-shadow:var(--cardshadow);transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
/* smaller than a button's 1.08 on purpose — the same spring reads as a much
   bigger jump across a full-width block, and 1.08 would clip at phone widths */
.goalbars.bump{transform:scale(1.04)}
.goalbars.empty{display:block;text-align:center;font-family:var(--label);font-size:11.5px;color:var(--on-surface-faint);cursor:pointer;padding:15px}
.goalbars.empty:hover{color:var(--accent-2)}
.gb{display:flex;flex-direction:column;gap:5px;min-width:0}
.gblab{font-family:var(--label);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-faint)}
.gbtrack{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.gbtrack span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .25s}
.gb.over .gbtrack span{background:var(--negative)}
.gb.over .gbnum{color:var(--negative)}
.gbnum{font-family:var(--label);font-size:12.5px;color:var(--on-surface);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbnum small{font-size:10px;color:var(--on-surface-faint)}
/* ── tabs (Log page) — sit on the ground, so they take on-ground ink ── */
.tabs{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--label);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;background:var(--on-ground-wash);color:var(--on-ground);border-radius:999px;padding:8px 15px;white-space:nowrap;flex:none}
.tab.on{background:var(--surface);color:var(--on-surface)}
/* ── goals page ── */
.goalgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:680px){.goalgrid{grid-template-columns:1fr}}
.gcheck{font-family:var(--label);font-size:11.5px;color:var(--on-surface-dim);margin-top:14px;line-height:1.6}
.gcheck b{color:var(--on-surface)}
.gcheck.off{color:var(--negative)}
.keylink{color:var(--accent-2);text-decoration:underline}
/* ── day navigator: "‹  DATE  ›" ── */
.datenav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:14px 2px 10px}
.datearrow{width:44px;height:44px;border-radius:14px;font-size:26px;line-height:1;color:var(--on-ground);background:var(--on-ground-wash);display:flex;align-items:center;justify-content:center;padding:0}
.datearrow:hover{background:var(--accent-wash)}
.datelabel{text-align:center;min-width:0}
.datemain{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--on-ground)}
.datesub{display:block;font-family:var(--label);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-ground-outline);margin-top:1px}
/* ── food picker: one search box, a scan button, then rows ── */
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1;font-size:14px;padding:11px 14px;border-radius:14px}
.scanbtn2{flex:none;width:52px;border-radius:14px;background:var(--surface);color:var(--accent-2);display:flex;align-items:center;justify-content:center;padding:0}
.scanbtn2:hover{background:var(--surface-2)}
.scanbtn2 svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* two up, like the stat tiles on the brand board */
.ftiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.frow{display:flex;flex-direction:column;align-items:flex-start;gap:7px;width:100%;text-align:left;
  background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--cardshadow)}
.frow:hover{background:var(--surface-2)}
.srcbadge{width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--accent-2);background:var(--surface-wash);flex:none}
.srcbadge.db{color:var(--accent-2);background:var(--accent-wash)}
.srcbadge svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.frname{font-size:14px;font-weight:500;line-height:1.32;color:var(--on-surface);min-width:0;overflow-wrap:anywhere}
.frbrand{display:block;font-size:10.5px;font-weight:400;color:var(--on-surface-faint);margin-top:3px}
.frmeta{margin-top:auto;font-family:var(--label);font-size:17px;font-weight:600;color:var(--accent-2);font-variant-numeric:tabular-nums}
.frmeta small{display:block;font-size:10.5px;font-weight:400;color:var(--on-surface-faint);margin-top:1px;letter-spacing:.02em}
@media(max-width:400px){.ftiles{grid-template-columns:1fr}}
/* ── the food page ── */
.fdhead{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:4px 2px 2px}
.fdhead .srcbadge{width:26px;height:26px;margin-top:3px}
.fdhead .srcbadge svg{width:19px;height:19px}
.fdhead h1{grid-column:2;font-size:24px;color:var(--on-ground);overflow-wrap:anywhere}
.fdbrand{grid-column:2;font-family:var(--label);font-size:11.5px;color:var(--on-ground-outline);margin-top:3px}
.fdbase{grid-column:2;font-family:var(--label);font-size:11.5px;color:var(--on-ground-outline);margin-top:6px}
/* ── nutrition: reference material, so it sits on the page rather than in a
   block — nothing here is editable and it shouldn't look like it is ── */
.ph .nutper{margin-left:auto;font-family:var(--label);font-size:10.5px;color:var(--on-ground-outline);text-transform:none;letter-spacing:0}
.nutlist{display:flex;flex-direction:column}
.nutrow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:8px 2px;font-size:14px;color:var(--on-ground);
  border-bottom:1px solid var(--on-ground-wash)}
.nutrow span:last-child{font-family:var(--label);font-variant-numeric:tabular-nums;white-space:nowrap}
.nutrow.sub{padding-left:18px;font-size:12.5px;color:var(--on-ground-outline)}
.nutgrp{font-family:var(--label);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--on-ground-outline);padding:16px 2px 5px}
.nutnote{font-family:var(--label);font-size:11px;color:var(--on-ground-outline);padding:10px 2px 2px;line-height:1.5}
.unitsel{width:auto;flex:1;min-width:0;font-family:var(--label);font-size:12px;padding:6px 8px}
.blockaddbtn.danger{color:var(--on-ground-negative);background:var(--on-ground-negative-wash)}
/* ── confirm before anything is destroyed ── */
.confirmrow{display:flex;gap:8px;margin-top:18px}
.cbtn{flex:1;font-family:var(--label);font-size:13px;border-radius:12px;padding:11px 0;background:var(--surface-2);color:var(--on-surface)}
.cbtn.danger{background:var(--negative);color:var(--on-accent);font-weight:600}
.cbtn.danger:hover{opacity:.9}
/* ── Add: a chooser of big targets, not a page of its own ── */
.addmenu{display:grid;gap:12px}
.addtile{display:grid;grid-template-columns:56px 1fr;grid-template-rows:auto auto;column-gap:15px;
  background:var(--surface);border-radius:20px;padding:18px;text-align:left;width:100%;box-shadow:var(--cardshadow)}
.addtile:hover{background:var(--surface-2)}
/* the badge is lit from the top-left and lifted off the card, so the tile reads
   as two planes rather than a flat swatch behind a glyph */
.addtileicon{grid-row:1/3;align-self:center;width:56px;height:56px;border-radius:19px;
  background:linear-gradient(155deg,var(--surface),var(--accent-wash));
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--badgeshadow)}
.addtileicon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.addtilelab{align-self:end;font-size:19px;font-weight:600;color:var(--on-surface)}
.addtilesub{align-self:start;font-family:var(--label);font-size:11.5px;color:var(--on-surface-faint);margin-top:3px}
/* ── weigh-in ── */
.wbig{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 2px}
.wbig input{width:auto;max-width:190px;font-family:var(--label);font-size:32px;padding:12px 16px;text-align:center}
.wunit{font-family:var(--label);font-size:15px;color:var(--on-surface-faint)}
.wrecent{display:flex;flex-direction:column;gap:5px}
.wrrow{display:flex;justify-content:space-between;font-family:var(--label);font-size:12px;color:var(--on-surface-dim);background:var(--surface-2);border-radius:12px;padding:8px 12px}
.dayweigh{font-family:var(--label);font-size:12px;color:var(--on-ground);padding:12px 2px 2px}
.dayweigh b{color:var(--on-ground)}
/* back is its own block; the note sits on the ground beside it, saying what the
   page is doing rather than labelling the button */
.backrow{display:flex;align-items:center;gap:13px;margin:12px 0 16px}
.backblock{width:42px;height:42px;border-radius:15px;flex:none;font-size:21px;line-height:1;background:var(--surface);color:var(--on-surface);box-shadow:var(--cardshadow);display:flex;align-items:center;justify-content:center;padding:0}
.backblock:hover{background:var(--accent);color:var(--on-accent)}
.backnote{font-size:14px;color:var(--on-ground);min-width:0}
.backnote b{font-weight:600;color:var(--accent-2)}
/* ── calc ── */
.calcpresets{flex-wrap:wrap}
.calcrow{display:grid;grid-template-columns:30px 1fr 84px 52px 18px;gap:4px 8px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--surface-2);margin-bottom:6px}
.calcrow.pinned{box-shadow:inset 2px 0 0 var(--accent)}
.calcrow.stocked{box-shadow:inset 2px 0 0 var(--accent-2)}
.lockbtn{width:26px;height:26px;border-radius:999px;line-height:0;background:var(--surface-3);flex:none;padding:0;
  color:var(--on-surface-faint);display:flex;align-items:center;justify-content:center}
/* locked is the state that changes the answer, so it's the one that takes colour */
.lockbtn.on{background:var(--accent-wash);color:var(--accent-2)}
.lockico{width:13.5px;height:13.5px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* the name is the doorway to the food's own page, so it has to read as tappable
   without turning the row into a button — the chevron carries that on its own */
.calcname{font-size:13px;color:var(--on-surface);min-width:0;overflow-wrap:anywhere;text-align:left;padding:0;display:flex;align-items:baseline;gap:4px}
.calcname:hover{color:var(--accent-2)}
.calcchev{color:var(--on-surface-faint);font-size:14px;flex:none}
.calcname:hover .calcchev{color:var(--accent-2)}
.scopechip{font-family:var(--label);font-size:10px;line-height:1;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--on-surface-dim);flex:none}
.scopechip.total{background:var(--accent-2);color:var(--on-ink)}
.calcrow input{font-family:var(--label);font-size:13px;padding:5px 7px;text-align:right}
.calcunit{font-family:var(--label);font-size:10.5px;color:var(--on-surface-faint)}
/* the second line of a row: what the batch turns this amount into, then macros */
.calcdetail{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-family:var(--label);font-size:10.5px;line-height:1.5}
.calcdetail:empty{display:none}
.calceach{color:var(--on-surface-dim)}
.calceach b{color:var(--on-surface)}
.calcmac{color:var(--accent-2)}
/* ── batch: how many meals the stock makes ── */
.batchrow{display:flex;align-items:center;gap:12px;margin-top:4px}
.batchstep{width:38px;height:38px;border-radius:12px;flex:none;padding:0;font-size:19px;line-height:1;background:var(--surface-2);color:var(--on-surface)}
.batchstep:hover:not([disabled]){background:var(--accent);color:var(--on-accent)}
.batchn{display:flex;align-items:baseline;gap:7px}
.bnum{font-family:var(--display);font-size:34px;line-height:1;color:var(--on-surface)}
.bword{font-family:var(--label);font-size:12px;color:var(--on-surface-dim)}
.batchbest{margin-left:auto;font-family:var(--label);font-size:11px;padding:6px 13px;border-radius:999px;background:var(--accent);color:var(--on-accent);flex:none}
.preplist{margin-top:2px}
.preprow{display:grid;grid-template-columns:1fr auto 62px;gap:10px;align-items:baseline;font-family:var(--label);font-size:12.5px;padding:6px 2px;color:var(--on-surface);border-top:1px solid var(--divider)}
.preprow:first-child{border-top:0}
.preprow>span:nth-child(2){font-variant-numeric:tabular-nums;text-align:right}
.prepnote{font-size:10.5px;color:var(--on-surface-faint);text-align:right}
.calcres{display:grid;grid-template-columns:1fr 62px 62px 62px;gap:8px;align-items:baseline;font-family:var(--label);font-size:12.5px;padding:6px 2px;color:var(--on-surface)}
.calcres>span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.calcres .calcwant{color:var(--on-surface-faint)}
.calcres .ok{color:var(--positive)}
.calcres .off{color:var(--negative)}
.calcres .none{color:var(--on-surface-faint)}
.mllog[disabled],.fincard button[disabled]{opacity:.4;cursor:default}
@media(max-width:680px){
  .calcrow{grid-template-columns:30px 1fr 66px 44px 18px}
  .calcres{grid-template-columns:1fr 54px 54px 50px;font-size:11.5px}
  .preprow{grid-template-columns:1fr auto 52px;font-size:11.5px}
}
/* Blocks are dark green, so their text is --on-surface (the light tiers). These
   elements sit straight on the pale mint/sage ground instead, so they go dark. */
.brand,.hrow h1,.sub2,.ph h3,.ph .sectoggle,.band .tempty{color:var(--on-ground)}
/* Nothing is outlined, so these on-ground buttons take a faint tint of the
   ground's own ink to stay recognizable as controls. */
.mealadd button{background:var(--on-ground-wash)}
/* ...but an empty-state line inside a card is on a block, so it stays light */
.fincard .tempty,.mlcard .tempty{color:var(--on-surface-faint)}
/* iOS Safari auto-zooms on focusing any input under 16px — force every field to 16px on mobile to stop it, regardless of the compact sizes used elsewhere */
@media(max-width:680px){input,select,textarea{font-size:16px!important}}

<script>
(function(){
var app=document.getElementById('app');
var KEY='lifesys';  // permanent — never bumped again
var LEGACY=['lifesys_v12','lifesys_v11','lifesys_v10','lifesys_v9','lifesys_v8','lifesys_v7','lifesys_v6','lifesys_v5','lifesys_v4','lifesys_v3','lifesys_v2','lifesys_v1','goaltree_v4','goaltree_v3'];
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function blankState(){return {health:{}};}
var SEED=blankState();

// Life System used to also cover Goals/Routines/Timeblock/To-dos/Finances;
// this app is Health-only now. Any of those fields left over from an older
// save are deliberately never read or touched here — they just sit inert
// in localStorage, recoverable, rather than being migrated or deleted.
var state=null;
function fixState(d){
  d.editing=null;
  if(!d.settings)d.settings={};
  if(d.settings.sound===undefined)d.settings.sound=true;
  if(!d.health)d.health={};
  if(!d.health.entries)d.health.entries=[];
  if(!d.health.foods)d.health.foods=[];
  // anything saved before provenance was tracked was necessarily hand-entered
  (d.health.foods||[]).forEach(function(f){if(!f.unit)f.unit='g';if(!f.source)f.source='manual';});
  if(!d.health.meals)d.health.meals=[];
  (d.health.meals||[]).forEach(function(m){
    if(m.mult===undefined||m.mult==='')m.mult=1;
    if(!m.items)m.items=[];
  });
  if(!d.health.log)d.health.log=[];
  (d.health.log||[]).forEach(function(r){
    // rows used to assume grams; keep the number, name the unit
    if(r.qty===undefined){r.qty=r.grams===undefined?0:r.grams;r.unit=r.unit||'g';delete r.grams;}
  });
  // Days logged before carbs and fat were kept on the entry still have their
  // food rows, and those rows carry both. Recompute rather than leave the new
  // charts blank for every day already recorded — and only where the food log
  // can actually answer, so a hand-typed day stays untouched.
  (function(){
    var byDate={};
    (d.health.log||[]).forEach(function(r){
      var t=byDate[r.date]||(byDate[r.date]={carbs:0,fat:0});
      t.carbs+=num(r.carbs);t.fat+=num(r.fat);
    });
    (d.health.entries||[]).forEach(function(e){
      ['carbs','fat'].forEach(function(k){
        if(e[k]!==undefined&&e[k]!=='')return;
        e[k]=byDate[e.date]?Math.round(byDate[e.date][k]*10)/10:'';
      });
    });
  })();
  if(d.health.targetWeight===undefined)d.health.targetWeight=200;
  // daily targets — everything in the app now measures against these
  if(!d.health.goals)d.health.goals={};
  var g=d.health.goals;
  // the old lone weight target becomes one goal among five; the original field
  // is left in place rather than deleted, same non-destructive rule as above
  if(g.weight===undefined||g.weight==='')g.weight=d.health.targetWeight;
  ['calories','protein','carbs','fat'].forEach(function(k){if(g[k]===undefined)g[k]='';});
  // USDA FoodData Central key. Deliberately per-device in localStorage and never
  // in the source: USDA deactivates any key it finds in a public repo, and this
  // repo is public.
  if(d.settings.fdcKey===undefined)d.settings.fdcKey='';
  return d;
}
async function loadState(){
  // 1) your saved data always wins
  try{var r=localStorage.getItem(KEY);if(r)return fixState(JSON.parse(r));}catch(e){}
  // 2) one-time import from any older key
  for(var i=0;i<LEGACY.length;i++){
    try{
      var old=localStorage.getItem(LEGACY[i]);
      if(old){var d=fixState(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(d));return d;}
    }catch(e){}
  }
  // 3) genuinely empty -> seed
  return fixState(JSON.parse(JSON.stringify(SEED)));
}
var UNDO=[];var UNDOING=false;
async function save(){
  try{
    var c=JSON.parse(JSON.stringify(state));c.editing=null;delete c._rst;
    if(!UNDOING){UNDO.push(JSON.stringify(c));if(UNDO.length>20)UNDO.shift();}
    localStorage.setItem(KEY,JSON.stringify(c));
  }catch(e){}
}
async function undoLast(){
  if(UNDO.length<2)return;
  UNDO.pop(); // discard current
  var prev=UNDO[UNDO.length-1];
  UNDOING=true;
  state=JSON.parse(prev);
  await save();
  UNDOING=false;
  render();
}
function exportData(){
  var c=JSON.parse(JSON.stringify(state));c.editing=null;delete c._rst;
  var blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='life-system-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function importData(){
  var input=document.getElementById('importfile');if(!input)return;
  input.value='';input.click();
}
function handleImportFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    var parsed;
    try{parsed=JSON.parse(reader.result);}catch(e){alert('That file isn’t valid — it doesn’t look like a Life System backup.');return;}
    if(!parsed||typeof parsed!=='object'){alert('That file isn’t valid — it doesn’t look like a Life System backup.');return;}
    if(!confirm('This replaces everything currently in the app with what’s in this file. This can’t be undone. Continue?'))return;
    var fixed=fixState(parsed);
    localStorage.setItem(KEY,JSON.stringify(fixed));
    location.reload();
  };
  reader.onerror=function(){alert('Couldn’t read that file.');};
  reader.readAsText(file);
}
function dateOnly(x){var d=new Date(x+'T00:00:00');return isNaN(d)?null:d;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtShort(dateStr){var d=new Date(dateStr+'T00:00:00');if(isNaN(d))return dateStr;return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function fmtFull(dateStr){var d=new Date(dateStr+'T00:00:00');if(isNaN(d))return dateStr;return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});}

function shiftDate(dateStr,days){
  var d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtLong(dateStr){
  var d=new Date(dateStr+'T00:00:00');if(isNaN(d))return dateStr;
  if(dateStr===todayStr())return 'Today';
  if(dateStr===shiftDate(todayStr(),-1))return 'Yesterday';
  if(dateStr===shiftDate(todayStr(),1))return 'Tomorrow';
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}

// in state — reopening the app should always land on the Log, showing today,
// not wherever you happened to leave off.
var page='log';
// which day the Log page is showing, and which day new entries are written to.
// They're separate on purpose: browsing back through last week shouldn't quietly
// redirect where the Add page files things.
var viewDate=todayStr();
var addTarget=todayStr();
// true while the Log page is showing the food picker for viewDate rather than
// that day's sheet — it's an overlay on the day, not a trip to the Add tab
var dayAddOpen=false;
// The same picker is reachable two ways, and back has to mean the place you
// actually came from: 'log' returns to the day's sheet, 'add' to the Add menu.
var dayAddFrom='log';
// set after logging so the goal bars pop once — a full render() rebuilds them,
// so the class can only go on after the new element exists
var bumpBars=false;
// where to put the page back after a detour into a food's own page
var restoreScroll=null,backScrollY=0;
// Add sits in the middle as a raised gold button — it's the thing you open most,
// and the board's layout puts the primary action dead centre.
var PAGES=[
  {key:'log',label:'Log'},
  {key:'calc',label:'Calc'},
  {key:'add',label:'Add'},
  {key:'goals',label:'Goals'},
  {key:'history',label:'History'}
];
var NAV_ICONS={
  log:'<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/>',
  add:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8.2v7.6M8.2 12h7.6"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.6 7.6h6.8"/><path d="M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01" stroke-width="2.6"/>',
  goals:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12h.01" stroke-width="2.8"/>',
  history:'<path d="M4 18.5h16"/><path d="M6 15l4-5 3.5 3L19 7"/>'
};
// which day the page you're looking at is actually about — so the goal bars
// report the same day the rest of the screen does
function contextDate(){
  if(page==='log')return viewDate;
  if(page==='add')return addTarget;
  return todayStr();
}
function pageBody(){
  if(page==='add')return buildAdd();
  if(page==='calc')return buildCalc();
  if(page==='goals')return buildGoals();
  if(page==='history')return buildHistory();
  return buildDay();
}
function render(){
  app.innerHTML=topbar()+goalBars()+pageBody()+bottomNav()+confirmHtml();
  applyBands();
  // stepping into a food's page and back out is a detour, not a new place — you
  // should land where you left, not at the top of a list you'd scrolled through
  if(restoreScroll!==null){
    var ry=restoreScroll;restoreScroll=null;
    requestAnimationFrame(function(){window.scrollTo(0,ry);});
  }
  // the same spring a button runs on :active — grow, then let it settle back.
  // rAF because the class has to land on a frame after the element is painted,
  // or there's no transition to animate from.
  if(bumpBars){
    bumpBars=false;
    var bars=app.querySelector('.goalbars');
    if(bars)requestAnimationFrame(function(){
      bars.classList.add('bump');
      setTimeout(function(){bars.classList.remove('bump');},130);
    });
  }
  if(foodQuery&&document.getElementById('localfoods'))refreshPicker();
  var ed=app.querySelector('[data-e="1"]');if(ed){ed.focus();if(ed.select)ed.select();}
}
// The running "how much room is left" read-out for whichever day is on screen.
// It rides above every page you'd log or calculate from; Goals and History are
// about other days, so it's omitted there rather than showing a number that
// doesn't apply.
function goalBars(){
  if(page==='goals'||page==='history')return '';
  var g=state.health.goals||{};
  var t=logTotals(logFor(contextDate()));
  var defs=[{k:'calories',lab:'Cal',v:t.calories,u:'',dp:0},
            {k:'protein',lab:'Protein',v:t.protein,u:'g',dp:1},
            {k:'carbs',lab:'Carbs',v:t.carbs,u:'g',dp:1},
            {k:'fat',lab:'Fat',v:t.fat,u:'g',dp:1}];
  if(!defs.some(function(d){return num(g[d.k])>0;}))
    return '<div class="goalbars empty" data-a="nav" data-page="goals">Set your daily targets to track against them →</div>';
  return '<div class="goalbars">'+defs.map(function(d){
    var goal=num(g[d.k]),have=d.dp?Math.round(d.v*10)/10:Math.round(d.v);
    if(goal<=0)return '<div class="gb"><div class="gblab">'+d.lab+'</div><div class="gbtrack"></div>'
      +'<div class="gbnum">'+have+d.u+'<small>/—</small></div></div>';
    var over=d.v>goal*1.02;
    return '<div class="gb'+(over?' over':'')+'"><div class="gblab">'+d.lab+'</div>'
      +'<div class="gbtrack"><span style="width:'+Math.min(d.v/goal*100,100).toFixed(1)+'%"></span></div>'
      +'<div class="gbnum">'+have+'<small>/'+trimNum(goal)+d.u+'</small></div></div>';
  }).join('')+'</div>';
}
function bottomNav(){
  return '<div class="bottomnav">'+PAGES.map(function(p){
    if(p.key==='add')
      return '<button type="button" class="navfab'+(page===p.key?' on':'')+'" data-a="nav" data-page="add" aria-label="Add">'
        +'<svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>';
    return '<button type="button" class="navbtn'+(page===p.key?' on':'')+'" data-a="nav" data-page="'+p.key+'">'
      +'<span class="navicon"><svg viewBox="0 0 24 24">'+NAV_ICONS[p.key]+'</svg></span>'
      +'<span class="navlab">'+p.label+'</span></button>';
  }).join('')+'</div>';
}

// Group each page's sections into bands, starting a new one at every .ph header.
// These used to alternate mint/sage, with the colour change acting as the
// divider; the ground is a single mint now, so all they contribute is the
// breathing room between sections.
var BANDSKIP=['topbar','settingsoverlay','goalbars','bottomnav','tabs','datenav','backrow'];
function applyBands(){
  var kids=[].slice.call(app.children),cur=null;
  kids.forEach(function(el){
    if(BANDSKIP.some(function(c){return el.classList.contains(c);})){cur=null;return;}
    if(el.classList.contains('ph')||!cur){
      cur=document.createElement('div');
      cur.className='band';
      app.insertBefore(cur,el);
    }
    cur.appendChild(el);
  });
}

// health
function healthEntry(dateStr){return (state.health.entries||[]).filter(function(e){return e.date===dateStr;})[0];}
function upsertHealth(dateStr,field,val){
  state.health.entries=state.health.entries||[];
  var e=healthEntry(dateStr);
  if(!e){e={id:uid(),date:dateStr,weight:'',calories:'',protein:'',carbs:'',fat:'',note:''};state.health.entries.push(e);}
  e[field]=val;
}
// Axis ticks a person would have chosen: round steps at 1/2/2.5/5/10 × a power
// of ten, with the domain widened out to whole ticks so the curve sits inside
// the grid instead of touching the top and bottom of the box.
function niceTicks(min,max,count){
  var span=max-min;
  if(!(span>0))span=Math.abs(max)||1;
  var raw=span/Math.max(1,count);
  var mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
  var norm=raw/mag,step;
  if(norm<=1)step=1;else if(norm<=2)step=2;else if(norm<=2.5)step=2.5;else if(norm<=5)step=5;else step=10;
  step*=mag;
  var lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;
  var out=[];
  for(var v=lo;v<=hi+step*1e-9;v+=step)out.push(Math.round(v*1e6)/1e6);
  return out;
}
// Catmull-Rom through the points, converted to cubic béziers. The control
// points are clamped to each segment's own range, which is what keeps a spline

// The same ring for a stretch of days: totals are the per-day averages, so the

function macroPieAvgHtml(entries){
  // a weight-only day is not a day you ate nothing — it's a day with no macro
  // record, and counting it would quietly halve every slice
  var withMacros=entries.filter(function(e){
    return ['protein','carbs','fat'].some(function(k){return e[k]!==''&&e[k]!=null&&!isNaN(parseFloat(e[k]));});
  });
  if(!withMacros.length)return '';
  var t={},n=withMacros.length;
  ['protein','carbs','fat','calories'].forEach(function(k){t[k]=avgField(withMacros,k)||0;});
  return macroPie(t,'Average macro split across '+n+' logged days',
    'Average share of calories by macro across '+n+' logged day'+(n===1?'':'s')+' (4/4/9).');
}
// t is {protein,carbs,fat,calories} — a day's totals or an average of them
function macroPie(t,aria,capLead){
  var pk=t.protein*4,ck=t.carbs*4,fk=t.fat*9,mk=pk+ck+fk;
  if(mk<=0)return '';
  // deep green / gold / terracotta — three of the board's tones, each readable
  // against a light card and distinguishable from the other two
  var segs=[{lab:'Protein',v:'--accent-2',g:t.protein,kcal:pk},{lab:'Carbs',v:'--accent',g:t.carbs,kcal:ck},{lab:'Fat',v:'--accent-3',g:t.fat,kcal:fk}];
  // Each segment is a cushion, drawn in three passes: the flat colour, then a
  // rim on each side of the band. Which rim is light and which is dark depends
  // on where round the ring you are — see the gradients below. The rims dome the
  // cross-section; the middle of the band is left untouched, so each colour
  // reads as itself between them.
  var R=45,SW=21,off=0,arcs='',bevelIn='',bevelOut='';
  // round caps stick out half a stroke width past the dash, so the gap between
  // segments has to pay for two of them before any visible gap is left over
  var CAP=SW/2/(2*Math.PI*R)*100,GAP=2*CAP+1.3;
  function arc(r,w,stroke,dash,offset,extra,mask){
    return '<circle cx="60" cy="60" r="'+r.toFixed(2)+'" fill="none" stroke="'+stroke
      +'" stroke-width="'+w.toFixed(2)+'" stroke-linecap="round" pathLength="100"'
      +(mask?' mask="url(#'+mask+')"':'')
      +' stroke-dasharray="'+dash.toFixed(2)+' '+(100-dash).toFixed(2)+'"'
      +' stroke-dashoffset="'+(-offset).toFixed(2)+'">'+(extra||'')+'</circle>';
  }
  // Each bevel is the full band again, then masked down to a rim. The mask is a
  // radial ramp, so it is opaque right at the band's edge and falls off inward —
  // the highlight starts where the colour ends and dissolves into it rather than
  // sitting on top as a stripe. FALL is what makes it soft; kept under a third
  // of the band so the edge still reads crisp.
  var EDGE_OUT=R+SW/2,EDGE_IN=R-SW/2,FALL=5.7;
  function rimMask(id,fromR,toR){
    // stops are fractions of EDGE_OUT, the gradient's own radius
    function at(v){return (v/EDGE_OUT).toFixed(4);}
    var lo=Math.min(fromR,toR),hi=Math.max(fromR,toR);
    var keepOutside=toR>fromR;   // true → opaque at the outer end
    return '<mask id="'+id+'" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">'
      +'<radialGradient id="'+id+'g" gradientUnits="userSpaceOnUse" cx="60" cy="60" r="'+EDGE_OUT+'">'
      +'<stop offset="0" stop-color="'+(keepOutside?'#000':'#fff')+'"/>'
      +'<stop offset="'+at(lo)+'" stop-color="'+(keepOutside?'#000':'#fff')+'"/>'
      +'<stop offset="'+at(lo+(hi-lo)*0.55)+'" stop-color="#6b6b6b"/>'
      +'<stop offset="'+at(hi)+'" stop-color="'+(keepOutside?'#fff':'#000')+'"/>'
      +'<stop offset="1" stop-color="'+(keepOutside?'#fff':'#000')+'"/>'
      +'</radialGradient>'
      +'<rect x="0" y="0" width="120" height="120" fill="url(#'+id+'g)"/></mask>';
  }
  var masks=rimMask('pieRimOut',EDGE_OUT-FALL,EDGE_OUT)
    +rimMask('pieRimIn',EDGE_IN+FALL,EDGE_IN);
  segs.forEach(function(s){
    var pct=s.kcal/mk*100;if(pct<=0)return;
    var dash=Math.max(pct-GAP,0.5);
    arcs+=arc(R,SW,'var('+s.v+')',dash,off,
      '<title>'+s.lab+': '+Math.round(s.kcal)+' cal · '+Math.round(pct)+'%</title>');
    bevelOut+=arc(R,SW,'url(#pieEdgeOut)',dash,off,'','pieRimOut');
    bevelIn+=arc(R,SW,'url(#pieEdgeIn)',dash,off,'','pieRimIn');
    off+=pct;
  });
  var legend=segs.map(function(s){
    var pct=s.kcal/mk*100;
    return '<div class="plrow"><span class="plsw" style="background:var('+s.v+')"></span>'
      +'<span class="pln">'+s.lab+'</span>'
      +'<span class="plv">'+(Math.round(s.g*10)/10)+'g</span>'
      +'<span class="plp">'+Math.round(pct)+'%</span></div>';
  }).join('');
  var logged=Math.round(t.calories);
  // label calories can differ from 4/4/9 math (fiber, sugar alcohols, rounding)
  var drift=logged>0?Math.abs(mk-logged)/logged:0;
  var cap=capLead+(drift>0.05?' Macros account for '+Math.round(mk)+' of '+logged+' cal logged — the gap is normal for fiber-heavy or processed foods.':'');
  return '<div class="piewrap">'
    +'<div class="pie"><svg viewBox="0 0 120 120" role="img" aria-label="'+esc(aria)+'">'
    // One light, up and to the left, on one torus — the three arcs are pieces of
    // the same ring, not three tubes each lit from its own inside.
    //
    // A torus's surface normal points radially outward. Top-left of the ring,
    // outward is toward the light, so the OUTER edge catches it and the inner
    // edge falls away. Bottom-right, outward points away from the light and it
    // reverses: the inner edge is lit, the outer edge is the dark side. So the
    // two edge gradients run opposite ways round the ring. Nothing tints the
    // middle of the band: the centre of each colour is the colour, and all the
    // modelling happens in the rims.
    +'<defs>'
    // outer edge: lit where the ring turns toward the light, dark where it turns away
    +'<linearGradient id="pieEdgeOut" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(90 .5 .5)">'
    +'<stop offset="0" stop-color="#fff" stop-opacity=".66"/>'
    +'<stop offset=".46" stop-color="#fff" stop-opacity="0"/>'
    +'<stop offset=".54" stop-color="#000" stop-opacity="0"/>'
    +'<stop offset="1" stop-color="#000" stop-opacity=".54"/>'
    +'</linearGradient>'
    // inner edge: the same story read backwards
    +'<linearGradient id="pieEdgeIn" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(90 .5 .5)">'
    +'<stop offset="0" stop-color="#000" stop-opacity=".40"/>'
    +'<stop offset=".46" stop-color="#000" stop-opacity="0"/>'
    +'<stop offset=".54" stop-color="#fff" stop-opacity="0"/>'
    +'<stop offset="1" stop-color="#fff" stop-opacity=".56"/>'
    +'</linearGradient>'
    +'<filter id="pieDrop" x="-20%" y="-20%" width="145%" height="145%">'
    +'<feDropShadow dx="2.6" dy="3.2" stdDeviation="1.5" flood-color="#051f20" flood-opacity=".38"/>'
    +'</filter>'+masks+'</defs>'
    // the filter sits on an unrotated wrapper: dx/dy are read in the group's own
    // space, so inside the -90 rotation the shadow would fall to the upper right
    +'<g filter="url(#pieDrop)"><g transform="rotate(-90 60 60)">'
    +arcs+bevelOut+bevelIn+'</g></g>'
    +'<text class="pietot" x="60" y="59" text-anchor="middle">'+logged+'</text>'
    +'<text class="pietotl" x="60" y="72" text-anchor="middle">cal</text>'
    +'</svg></div>'
    +'<div class="pielegend">'+legend+'<div class="piecap">'+cap+'</div></div></div>';
}
function buildFoodSheet(dateStr){

    if(r.gid){
      if(!seen[r.gid]){seen[r.gid]={meal:r.meal,gid:r.gid,rows:[]};blocks.push(seen[r.gid]);}
      seen[r.gid].rows.push(r);
    } else blocks.push({row:r});

  var endBtn=isToday
    ?'<button type="button" class="blockaddbtn spaced" data-a="endday">End day — save '+Math.round(t.calories)+' cal / '+(Math.round(t.protein*10)/10)+'g protein</button>'

    +addBtn+endBtn
    +'</div>';

      +'<span>'+shown+(unit?' '+unit:'')+'</span></div>';
  }
  var body=row('Calories',f.calories,'')
    +row('Protein',f.protein,'g')
    +row('Carbs',f.carbs,'g');
  MICROS.filter(function(x){return x.grp==='Carbs';}).forEach(function(x){body+=row(x.lab,m[x.k],x.u,true);});
  body+=row('Fat',f.fat,'g');
  MICROS.filter(function(x){return x.grp==='Fat';}).forEach(function(x){body+=row(x.lab,m[x.k],x.u,true);});
  ['Minerals','Vitamins'].forEach(function(g){

      .map(function(x){return row(x.lab,m[x.k],x.u);}).join('');
    if(rows)body+='<div class="nutgrp">'+g+'</div>'+rows;
  });
  var known=MICROS.filter(function(x){return m[x.k]!==undefined&&m[x.k]!==null&&m[x.k]!=='';}).length;

  // treating that as grams produced nonsense like "473.176g". Only trust it when explicitly grams.

    polyfat:'polyunsaturated-fat',cholesterol:'cholesterol',fiber:'fiber',sugars:'sugars',

    vitA:1e6,vitC:1000,vitD:1e6,vitE:1000,vitK:1e6,thiamin:1000,riboflavin:1000,

// failing on spaced, sequential requests — and the refusal comes back as a
// CORS-less network error rather than a clean status, so it can't be told apart
// from being offline. Retrying absorbs it.
async function fetchJSON(url,tries){
  tries=tries===undefined?3:tries;
  var last;
  for(var i=0;i<tries;i++){
    try{
      var res=await fetch(url);
      if(!res.ok)throw new Error('http '+res.status);
      return await res.json();
    }catch(e){
      last=e;
      if(i<tries-1)await new Promise(function(r){setTimeout(r,500*(i+1));});
    }
  }
  throw last;
}

  });

async function searchFDC(query,key){
  var url='https://api.nal.usda.gov/fdc/v1/foods/search?api_key='+encodeURIComponent(key)

// the qrcode library is a real download (barcode decoding engine) that almost
// nobody needs every session — load it on first scan instead of on every page
// load, and only once even if the scanner gets opened/closed/reopened.
var scannerScriptPromise=null;
function loadScannerScript(){
  if(typeof Html5Qrcode!=='undefined')return Promise.resolve();
  if(scannerScriptPromise)return scannerScriptPromise;
  scannerScriptPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload=function(){resolve();};
    s.onerror=function(){scannerScriptPromise=null;reject(new Error('scanner script failed to load'));};
    document.head.appendChild(s);
  });
  return scannerScriptPromise;
}
function openScanner(){
  loadScannerScript().then(function(){
    var overlay=document.createElement('div');
    overlay.id='scanoverlay';overlay.className='scanoverlay';
    overlay.innerHTML='<div class="scanbox"><div class="scanhead"><span>Scan a barcode</span><button type="button" id="scancancel">×</button></div><div id="reader"></div><div class="scanhint" id="scanhint">Point your camera at the barcode.</div></div>';
    document.body.appendChild(overlay);
    document.getElementById('scancancel').addEventListener('click',closeScanner);
    var qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]});
    window.__activeScanner=qr;
    qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},
      function(decodedText){onBarcodeScanned(decodedText);},
      function(){}
    ).catch(function(err){
      var hint=document.getElementById('scanhint');
      if(hint)hint.textContent='Could not access the camera — check camera permission for this site.';
    });
  }).catch(function(){
    alert('Scanner failed to load — check your connection and try again.');
  });
}
function closeScanner(){
  var qr=window.__activeScanner,overlay=document.getElementById('scanoverlay'),removed=false;
  function remove(){if(removed)return;removed=true;if(overlay&&overlay.parentNode)overlay.parentNode.removeChild(overlay);window.__activeScanner=null;}
  if(qr){
    // qr.stop() can hang indefinitely if the camera never actually started (e.g. permission
    // denied) — don't trust it to always settle, back it with a hard timeout either way
    try{qr.stop().then(function(){try{qr.clear();}catch(e){}remove();}).catch(remove);}catch(e){remove();}
    setTimeout(remove,1200);
  }
  else remove();
}

function calcShareOfDay(fr){

function r2(x){return Math.round(x*100)/100;}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function rowBatch(r,n){

function calcRowMacros(r,n){

function activeKeys(){

// Non-negative least squares by projected gradient, solved for ONE meal with
// the batch already divided out. Small enough (a handful of foods against four
// macros) that a closed-form solve isn't worth the code — and the projection
// step is what actually matters here.
function solveCalcAt(meals,iters){
  var keys=activeKeys();
  var free=[];
  calcRows.forEach(function(r,i){if(r.mode==='solve'&&calcFood(r))free.push(i);});
  if(!keys.length||!free.length)return;
  // whatever you've already committed to comes off the target first — that's
  // what makes both "I'm having exactly this much chicken" and "I have 900g to
  // get through" work, since the second is just the first divided by the batch
  var b=keys.map(function(k){
    var left=num(calcTargets[k]);
    calcRows.forEach(function(r){
      if(r.mode==='solve')return;
      var m=calcRowMacros(r,meals);if(m)left-=m[k];

  // unweighted fit would optimize calories and ignore the macros entirely.
  var w=keys.map(function(k){return 1/num(calcTargets[k]);});
  var A=keys.map(function(k,ki){
    return free.map(function(i){return num(calcFood(calcRows[i])[k])*w[ki];});
  });
  var bw=b.map(function(v,ki){return v*w[ki];});

  for(j=0;j<n;j++)x.push(0);

  var L=0;
  for(k=0;k<A.length;k++)for(j=0;j<n;j++)L+=A[k][j]*A[k][j];

      var gr=0;for(k=0;k<A.length;k++)gr+=A[k][j]*res[k];

function targetMiss(k,have){

  var kind=calcKinds[k]||'eq',d=have-want,tol=calcTol(k);
  if(kind==='min')return d>=-tol?0:(-d-tol)/want;

// How far the stock goes. Sweep the batch size, solve at each, and keep the

// either way and more meals is the entire point of prepping.
function suggestMeals(){
  if(!calcHaveRows().length||!activeKeys().length)return null;

  for(var n=1;n<=CALC_MAX_MEALS;n++){

    if(c.worst<bestMiss-1e-6){bestMiss=c.worst;best=n;bestWho=c.who;}
    else if(Math.abs(c.worst-bestMiss)<=1e-6)best=n;   // ties go to more meals
  }
  if(feasible.length)return {n:feasible[feasible.length-1],ok:true,lo:feasible[0],hi:feasible[feasible.length-1]};

// same "commit a running total, then start clean" idea as End Day, one

function avgField(entries,field){

// events
// iOS Safari only simulates :active state on a sustained touch, not a quick
// tap, unless some element on the page has a touchstart listener. This one
// does nothing itself — its only job is to turn that behavior on so the
// button press-pop animation actually plays on a normal tap.
document.addEventListener('touchstart',function(){},{passive:true});
// Web Audio, not <audio>: HTMLMediaElement playback (even pooled/preloaded)
// re-seeks and re-primes its pipeline on every play(), which on mobile shows
// up as ~1s of audible lag behind the tap. Decoding once into an AudioBuffer
// and firing a fresh BufferSourceNode per tap plays with ~0 latency instead.
var POP_SRC='Sounds/Life%20System%20Sounds%20-%20Pop.wav';
var POP_CTX=null,POP_BUFFER=null;
function loadPop(){
  if(POP_CTX)return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  POP_CTX=new AC();
  fetch(POP_SRC).then(function(r){return r.arrayBuffer();})
    .then(function(buf){return POP_CTX.decodeAudioData(buf);})
    .then(function(decoded){POP_BUFFER=decoded;})
    .catch(function(){});
}
// Must be born inside a real user gesture — iOS "Add to Home Screen" standalone
// mode won't unlock an AudioContext created ahead of time, even with resume()
// called later from a click. The earliest possible touch on the page creates
// it; playPop also calls this defensively in case that listener hasn't fired.
document.addEventListener('pointerdown',loadPop,{once:true,passive:true});
function playPop(){
  if(state.settings&&state.settings.sound===false)return;
  loadPop();
  if(!POP_CTX||!POP_BUFFER)return;
  if(POP_CTX.state==='suspended')POP_CTX.resume();
  var vol=(state.settings&&state.settings.volume!=null)?state.settings.volume:70;
  var src=POP_CTX.createBufferSource();
  var gain=POP_CTX.createGain();
  gain.gain.value=vol/100;
  src.buffer=POP_BUFFER;
  src.connect(gain).connect(POP_CTX.destination);
  src.start(0);
}

  if(a==='fnew'&&t.dataset.f==='unit'){
    // switching to a countable unit (scoop/slice/bar/packet/serving) mid-entry — the macros
    // already scanned/typed represent whatever the old serving was, so just re-anchor the
    // serving number to 1 rather than leaving a stale "30" sitting next to "scoop"
    if(isCountableUnit(t.value)){
      var servingInput=app.querySelector('[data-a="fnew"][data-f="serving"]');
      if(servingInput)servingInput.value='1';
    }
    return;
  }
  if(a==='funit'){
    var fu=fFood(t.dataset.id);
    if(fu&&displayUnit(fu)!==t.value){
      // Only "I have" holds an amount of food. Under "I want", tamt is grams of
      // a macro — it has nothing to do with how you're measuring, and converting
      // it turns "40g of protein" into "1.41oz of protein".
      var holdsAmount=isCountableUnit(fu.unit)||fu.mode==='have';
      var conv=holdsAmount?convertUnit(num(fu.tamt),displayUnit(fu),t.value,fu.gPerMl):null;
      fu.dunit=t.value;
      // carry the amount across rather than clearing it — switching g to oz
      // should restate what you already typed, not make you measure again
      if(holdsAmount&&fu.tamt!==''&&fu.tamt!==undefined&&fu.tamt!==null&&conv!==null)
        fu.tamt=roundSig(conv,4);
      save();render();
    }
    return;
  }
  if(a==='foodmac'){var fd=fFood(t.dataset.id);if(fd){fd.tmac=t.value;save();refreshFoodCard(fd.id);}}
  if(a==='mealwantmac'){var mwm=fMeal(t.dataset.id);if(mwm){mwm.wantMac=t.value;applyMealWant(mwm);save();render();}}
});
app.addEventListener('blur',function(e){var t=e.target,a=t.dataset&&t.dataset.a;if(!a)return;
  if(a==='cmln'){var ml=fMeal(t.dataset.id);var mv=t.value.trim();if(ml&&mv)ml.name=mv;state.editing=null;save();render();}
},true);

(async function(){state=await loadState();UNDO.push(JSON.stringify(state));render();})();
})();
</script>
