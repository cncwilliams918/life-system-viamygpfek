/* ============================================================
   PALETTE — every color in the app is one of these roles.
   To re-theme: edit only this block. Everything below reads
   roles (--surface, --accent, --on-ground…), never raw hex.
   The <meta name="theme-color"> tag in <head> can't read CSS
   variables, so it must be updated by hand to match --ground.
   ============================================================ */
:root{
  /* ground: the page background, and text/borders that sit directly on it (no card).
     The ground is LIGHT and blocks are DARK, so on-ground text is the darkest green. */
  --ground:#daf1de;              /* mint */
  --ground-alt:#8eb69b;          /* sage — alternates with --ground band to band */
  --on-ground:#051f20;           /* darkest green — text on either ground color */
  --on-ground-outline:rgba(5,31,32,.35);
  --on-ground-wash:rgba(5,31,32,.08);
  --on-ground-negative:#8f2f22;  /* --negative is too light to read on the pale ground; darker stand-in */
  --on-ground-negative-wash:rgba(143,47,34,.12);

  /* surface: block backgrounds and their text tiers. Nothing is outlined — depth
     is the only separator, so these three tones must stay distinguishable:
     a block is lightest, a control inside it is darker, a field is darkest. */
  --surface:#235347;             /* every block */
  --surface-2:#235347;           /* inset within a block: buttons, panels, table head/total rows */
  --surface-3:#0b2b26;           /* deepest: form fields, and the 1px gaps used as rules */
  --surface-wash:rgba(218,241,222,.16);  /* translucent light fill on a block (e.g. XP bar track) */
  --on-surface:#daf1de;          /* mint — primary text on a block */
  --on-surface-dim:#b3d4bd;      /* secondary text on a block */
  --on-surface-faint:#8eb69b;    /* tertiary/muted text on a block */
  --divider:#0b2b26;             /* shown through grid/flex gaps, never as a border */

  /* accent: interactive/brand colors — accent is the default, 2 and 3 are alternates
     (per-goal color, macro donut slices). Accents sit on dark blocks, so they run light. */
  --accent:#8eb69b;
  --accent-2:#daf1de;
  --accent-3:#4e8f79;
  --accent-wash:rgba(142,182,155,.14);
  --on-accent:#051f20;           /* text/icon on a filled accent background */

  /* status — derived, not from the source palette: a six-tone monochrome can't
     signal good/bad on its own, and danger in particular has to read as danger. */
  --positive:#7fd1a5;
  --negative:#e0796b;
  --negative-wash:rgba(224,121,107,.14);

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{background:var(--ground);margin:0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
/* Sections alternate cognac <-> amber; the color change IS the divider, so no rules.
   Negative margins pull each band out to the viewport edges while the matching
   padding puts its content back on the centered column. */
.band{margin:0 calc(50% - 50vw);padding:16px calc(50vw - 50%)}
.band.alt{background:var(--ground-alt)}
/* bottom padding clears the fixed .bottomnav so the last card is never trapped under it */
#app{color:var(--on-surface);font-family:var(--sans);line-height:1.5;max-width:920px;margin:0 auto;padding:8px 16px 108px}
#app *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app h1,#app h2,#app h3{margin:0;font-weight:600;letter-spacing:-.01em}

button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation}
.plusicon{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.15em;margin-right:.3em;background-color:currentColor;
  -webkit-mask:url(Images/Plus.png?v=2) center/contain no-repeat;mask:url(Images/Plus.png?v=2) center/contain no-repeat}
button:active{transform:scale(1.08)}
input,textarea,select{background:var(--surface-3);border:none;color:var(--on-surface);border-radius:12px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 2px var(--ac,var(--accent))}
input[type=time],input[type=date]{color-scheme:dark;font-family:var(--mono);font-size:13px}
input::placeholder,textarea::placeholder{color:var(--on-surface-faint);opacity:1}
input[type=checkbox]{width:auto;accent-color:var(--ac,var(--accent))}
textarea{resize:vertical;min-height:52px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-surface-dim)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 14px}
/* Only the PNGs' alpha is used, so their own color is irrelevant. Without mask
   support the fill would paint as a solid square — blank it instead. */
@supports not ((-webkit-mask-image:url(#i)) or (mask-image:url(#i))){
  .plusicon{background-color:transparent}
}

<script>
(function(){
var app=document.getElementById('app');
var KEY='lifesys';  // permanent — never bumped again
var LEGACY=['lifesys_v12','lifesys_v11','lifesys_v10','lifesys_v9','lifesys_v8','lifesys_v7','lifesys_v6','lifesys_v5','lifesys_v4','lifesys_v3','lifesys_v2','lifesys_v1','goaltree_v4','goaltree_v3'];
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function blankState(){return {health:{}};}
var SEED=blankState();

// Life System used to also cover Goals/Routines/Timeblock/To-dos/Finances;
// this app is Health-only now. Any of those fields left over from an older
// save are deliberately never read or touched here — they just sit inert
// in localStorage, recoverable, rather than being migrated or deleted.
var state=null;
function fixState(d){
  d.editing=null;
  if(!d.settings)d.settings={};
  if(d.settings.sound===undefined)d.settings.sound=true;
  if(!d.health)d.health={};
  if(!d.health.entries)d.health.entries=[];
  if(!d.health.foods)d.health.foods=[];
  (d.health.foods||[]).forEach(function(f){if(!f.unit)f.unit='g';});
  if(!d.health.meals)d.health.meals=[];
  (d.health.meals||[]).forEach(function(m){
    if(m.mult===undefined||m.mult==='')m.mult=1;
    if(!m.items)m.items=[];
  });
  if(!d.health.log)d.health.log=[];
  (d.health.log||[]).forEach(function(r){
    // rows used to assume grams; keep the number, name the unit
    if(r.qty===undefined){r.qty=r.grams===undefined?0:r.grams;r.unit=r.unit||'g';delete r.grams;}
  });
  if(d.health.targetWeight===undefined)d.health.targetWeight=200;
  // daily targets — everything in the app now measures against these
  if(!d.health.goals)d.health.goals={};
  var g=d.health.goals;
  // the old lone weight target becomes one goal among five; the original field
  // is left in place rather than deleted, same non-destructive rule as above
  if(g.weight===undefined||g.weight==='')g.weight=d.health.targetWeight;
  ['calories','protein','carbs','fat'].forEach(function(k){if(g[k]===undefined)g[k]='';});
  // USDA FoodData Central key. Deliberately per-device in localStorage and never
  // in the source: USDA deactivates any key it finds in a public repo, and this
  // repo is public.
  if(d.settings.fdcKey===undefined)d.settings.fdcKey='';
  return d;
}
async function loadState(){
  // 1) your saved data always wins
  try{var r=localStorage.getItem(KEY);if(r)return fixState(JSON.parse(r));}catch(e){}
  // 2) one-time import from any older key
  for(var i=0;i<LEGACY.length;i++){
    try{
      var old=localStorage.getItem(LEGACY[i]);
      if(old){var d=fixState(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(d));return d;}
    }catch(e){}
  }
  // 3) genuinely empty -> seed
  return fixState(JSON.parse(JSON.stringify(SEED)));
}
var UNDO=[];var UNDOING=false;
async function save(){
  try{
    var c=JSON.parse(JSON.stringify(state));c.editing=null;delete c._rst;
    if(!UNDOING){UNDO.push(JSON.stringify(c));if(UNDO.length>20)UNDO.shift();}
    localStorage.setItem(KEY,JSON.stringify(c));
  }catch(e){}
}
async function undoLast(){
  if(UNDO.length<2)return;
  UNDO.pop(); // discard current
  var prev=UNDO[UNDO.length-1];
  UNDOING=true;
  state=JSON.parse(prev);
  await save();
  UNDOING=false;
  render();
}
function exportData(){
  var c=JSON.parse(JSON.stringify(state));c.editing=null;delete c._rst;
  var blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='life-system-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function importData(){
  var input=document.getElementById('importfile');if(!input)return;
  input.value='';input.click();
}
function handleImportFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    var parsed;
    try{parsed=JSON.parse(reader.result);}catch(e){alert('That file isn’t valid — it doesn’t look like a Life System backup.');return;}
    if(!parsed||typeof parsed!=='object'){alert('That file isn’t valid — it doesn’t look like a Life System backup.');return;}
    if(!confirm('This replaces everything currently in the app with what’s in this file. This can’t be undone. Continue?'))return;
    var fixed=fixState(parsed);
    localStorage.setItem(KEY,JSON.stringify(fixed));
    location.reload();
  };
  reader.onerror=function(){alert('Couldn’t read that file.');};
  reader.readAsText(file);
}
function dateOnly(x){var d=new Date(x+'T00:00:00');return isNaN(d)?null:d;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtShort(dateStr){var d=new Date(dateStr+'T00:00:00');if(isNaN(d))return dateStr;return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}

// Five pages behind a fixed bottom nav. Page lives in a module var rather than
// in state — reopening the app should always land on Today, not wherever you
// happened to leave off.
var page='today';
var PAGES=[
  {key:'today',label:'Today'},
  {key:'log',label:'Log'},
  {key:'calc',label:'Calc'},
  {key:'goals',label:'Goals'},
  {key:'history',label:'History'}
];
var NAV_ICONS={
  today:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8" stroke-width="3.6"/>',
  log:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8.2v7.6M8.2 12h7.6"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.6 7.6h6.8"/><path d="M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01" stroke-width="2.6"/>',
  goals:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12h.01" stroke-width="2.8"/>',
  history:'<path d="M4 18.5h16"/><path d="M6 15l4-5 3.5 3L19 7"/>'
};
function pageBody(){
  if(page==='log')return buildLog();
  if(page==='calc')return buildCalc();
  if(page==='goals')return buildGoals();
  if(page==='history')return buildHistory();
  return buildToday();
}
function render(){
  app.innerHTML=topbar()+goalBars()+pageBody()+bottomNav();
  applyBands();
  if(foodSearchQuery)applyFoodSearch();
  var ed=app.querySelector('[data-e="1"]');if(ed){ed.focus();if(ed.select)ed.select();}
}
// The running "how much room is left today" read-out. It rides above every page
// you'd log or calculate from; Goals and History are about other days, so it's
// omitted there rather than showing a number that doesn't apply.
function goalBars(){
  if(page==='goals'||page==='history')return '';
  var g=state.health.goals||{};
  var t=logTotals(logFor(todayStr()));
  var defs=[{k:'calories',lab:'Cal',v:t.calories,u:'',dp:0},
            {k:'protein',lab:'Protein',v:t.protein,u:'g',dp:1},
            {k:'carbs',lab:'Carbs',v:t.carbs,u:'g',dp:1},
            {k:'fat',lab:'Fat',v:t.fat,u:'g',dp:1}];
  if(!defs.some(function(d){return num(g[d.k])>0;}))
    return '<div class="goalbars empty" data-a="nav" data-page="goals">Set your daily targets to track against them →</div>';
  return '<div class="goalbars">'+defs.map(function(d){
    var goal=num(g[d.k]),have=d.dp?Math.round(d.v*10)/10:Math.round(d.v);
    if(goal<=0)return '<div class="gb"><div class="gblab">'+d.lab+'</div><div class="gbtrack"></div>'
      +'<div class="gbnum">'+have+d.u+'<small>/—</small></div></div>';
    var over=d.v>goal*1.02;
    return '<div class="gb'+(over?' over':'')+'"><div class="gblab">'+d.lab+'</div>'
      +'<div class="gbtrack"><span style="width:'+Math.min(d.v/goal*100,100).toFixed(1)+'%"></span></div>'
      +'<div class="gbnum">'+have+'<small>/'+trimNum(goal)+d.u+'</small></div></div>';
  }).join('')+'</div>';
}
function bottomNav(){
  return '<div class="bottomnav">'+PAGES.map(function(p){
    return '<button type="button" class="navbtn'+(page===p.key?' on':'')+'" data-a="nav" data-page="'+p.key+'">'
      +'<span class="navicon"><svg viewBox="0 0 24 24">'+NAV_ICONS[p.key]+'</svg></span>'
      +'<span class="navlab">'+p.label+'</span></button>';
  }).join('')+'</div>';
}

// Wrap each page section in a band so the ground alternates cognac/amber.
// A new band starts at every .ph section header; the color change replaces divider rules.
var BANDSKIP=['topbar','settingsoverlay','goalbars','bottomnav','tabs'];
function applyBands(){
  var kids=[].slice.call(app.children),alt=false,started=false,cur=null;
  kids.forEach(function(el){
    if(BANDSKIP.some(function(c){return el.classList.contains(c);})){cur=null;return;}
    var head=el.classList.contains('ph');
    if(head||!cur){
      if(head&&started)alt=!alt;
      started=true;
      cur=document.createElement('div');
      cur.className='band'+(alt?' alt':'');
      app.insertBefore(cur,el);
    }
    cur.appendChild(el);
  });
}

var SETTINGS_ICON='<svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>';

function metricChart(entriesDesc,field,color,unitSuffix,emptyLabel){
  var pts=entriesDesc.filter(function(e){return e[field]!==''&&e[field]!=null&&!isNaN(parseFloat(e[field]));}).slice().reverse();
  if(pts.length<2)return '<div class="wchart empty">Log '+emptyLabel+' on at least two days to see the trend.</div>';
  var last=pts.slice(-90);
  var W=640,H=160,pad=30;
  var vs=last.map(function(e){return parseFloat(e[field]);});
  var min=Math.min.apply(null,vs),max=Math.max.apply(null,vs);
  if(min===max){min-=1;max+=1;}
  function xs(i){return pad+(i/(last.length-1))*(W-pad-10);}
  function ys(v){return H-pad+8-((v-min)/(max-min))*(H-pad-16);}
  var d=last.map(function(e,i){return (i===0?'M':'L')+xs(i).toFixed(1)+','+ys(parseFloat(e[field])).toFixed(1);}).join(' ');
  var dots=last.map(function(e,i){return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(parseFloat(e[field])).toFixed(1)+'" r="2.5" fill="'+color+'"><title>'+fmtShort(e.date)+': '+e[field]+unitSuffix+'</title></circle>';}).join('');
  var gridY=[min,(min+max)/2,max].map(function(v){var y=ys(v);return '<line x1="'+pad+'" x2="'+(W-4)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--divider)" stroke-width="1"/><text x="2" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--on-surface-faint)" font-family="ui-monospace,monospace">'+Math.round(v)+'</text>';}).join('');
  return '<div class="wchart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:160px">'+gridY+'<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg></div>';
}
function weightChart(entriesDesc){return metricChart(entriesDesc,'weight','var(--accent)',' lb','weight');}
function healthSummaryHtml(){

  var latest=entries.filter(function(e){return e.weight!=='';})[0];
  var tw=parseFloat((state.health.goals||{}).weight)||parseFloat(state.health.targetWeight)||0;
  var curW=latest?parseFloat(latest.weight):null;

    +'<div class="stat neu"><div class="sl">To target ('+tw+' lb)</div><div class="sv">'+(curW!==null?(curW>tw?'-':'+')+Math.abs(curW-tw).toFixed(1)+' lb':'—')+'</div></div>'
    +'</div><div class="statrow">'
    +'<div class="stat neu"><div class="sl">Avg calories / day (7d)</div><div class="sv">'+(avgCal===null?'—':avgCal)+'</div></div>'

function fFood(id){return (state.health.foods||[]).filter(function(f){return f.id===id;})[0];}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
var UNITS=['g','oz','lb','ml','l','cup','tbsp','tsp','slice','scoop','serving','bar','packet'];

var UNIT_ABBR=['g','kg','mg','oz','ml','l','lb'];
function trimNum(n){
  if(Math.abs(n)>=20)return String(Math.round(n));
  return n.toFixed(2).replace(/\.?0+$/,'');

function unitLabel(n,unit){
  var u=(unit||'g').trim()||'g';

}

function resolveFood(f,tmac,tamt,mult){
  // scale a food to hit `tamt` of `tmac`, then apply the meal multiplier (the bus fader)
  if(!f)return null;
  if(tamt===''||tamt===undefined||tamt===null)return null;
  var per=num(f[tmac||'protein']);if(per<=0)return null;
  var factor=(num(tamt)/per)*(mult===undefined?1:mult);
  return {grams:num(f.serving)*factor,calories:num(f.calories)*factor,protein:num(f.protein)*factor,carbs:num(f.carbs)*factor,fat:num(f.fat)*factor};
}
function resolveFoodQty(f,qty,mult){
  // countable units (serving/scoop/slice/bar/packet) skip the macro-target math entirely —
  // you're not dialing in a macro, you're just saying how many you're having
  if(!f)return null;
  if(qty===''||qty===undefined||qty===null)return null;
  var base=num(f.serving)||1;
  var factor=(num(qty)/base)*(mult===undefined?1:mult);
  return {grams:num(f.serving)*factor,calories:num(f.calories)*factor,protein:num(f.protein)*factor,carbs:num(f.carbs)*factor,fat:num(f.fat)*factor};
}

function resolveMealItem(f,mi,mult){return f&&(isCountableUnit(f.unit)||mi.mode==='have')?resolveFoodQty(f,mi.tamt,mult):resolveFood(f,mi.tmac,mi.tamt,mult);}

function fMeal(id){return (state.health.meals||[]).filter(function(m){return m.id===id;})[0];}

function mealTotalsAtMult(m,mult){

  });

}

// Open Food Facts is the fallback nutrition source, no key required —
// used for barcode lookups and, now, text search. Both funnel through this
// one parser so a search result and a scanned product resolve identically.
function parseOFFProduct(p,fallbackName){
  var n=p.nutriments||{};
  var name=p.product_name||p.generic_name||fallbackName;
  var servingG=parseFloat(p.serving_quantity);
  // serving_quantity isn't always grams — drinks report it in ml (e.g. Monster: 500 "ml"), and
  // treating that as grams produced nonsense like "473.176g". Only trust it when explicitly grams.
  var servingUnitIsGrams=(p.serving_quantity_unit||'').toLowerCase()==='g';
  var hasServingG=servingUnitIsGrams&&!isNaN(servingG)&&servingG>0;
  var has100g=n['energy-kcal_100g']!==undefined||n.proteins_100g!==undefined||n.carbohydrates_100g!==undefined||n.fat_100g!==undefined;
  var hasServingNutrients=n['energy-kcal_serving']!==undefined||n.proteins_serving!==undefined||n.carbohydrates_serving!==undefined||n.fat_serving!==undefined;
  if(!has100g&&!hasServingNutrients)return null;
  if(hasServingG&&hasServingNutrients){
    // real label serving size (e.g. "40g" for oats) with matching per-serving nutrients — use as printed
    return {name:name,serving:servingG,unit:'g',
      calories:Math.round(num(n['energy-kcal_serving'])),protein:num(n.proteins_serving),carbs:num(n.carbohydrates_serving),fat:num(n.fat_serving)};
  }
  if(hasServingG&&has100g){
    // known serving weight but no precomputed per-serving figures — scale the 100g numbers ourselves
    var f=servingG/100;
    return {name:name,serving:servingG,unit:'g',
      calories:Math.round(num(n['energy-kcal_100g'])*f),protein:num(n.proteins_100g)*f,carbs:num(n.carbohydrates_100g)*f,fat:num(n.fat_100g)*f};
  }
  if(hasServingNutrients){
    // per-serving nutrients exist but no gram weight given — don't invent a weight, call it 1 serving
    return {name:name,serving:1,unit:'serving',
      calories:Math.round(num(n['energy-kcal_serving'])),protein:num(n.proteins_serving),carbs:num(n.carbohydrates_serving),fat:num(n.fat_serving)};
  }
  // only 100g data, no serving info at all — same idea, present as 1 serving rather than a specific gram guess
  return {name:name,serving:1,unit:'serving',
    calories:Math.round(num(n['energy-kcal_100g'])),protein:num(n.proteins_100g),carbs:num(n.carbohydrates_100g),fat:num(n.fat_100g)};
}

async function lookupBarcode(code){

// failing on spaced, sequential requests — and the refusal comes back as a
// CORS-less network error rather than a clean status, so it can't be told apart
// from being offline. Retrying absorbs it.
async function fetchJSON(url,tries){
  tries=tries===undefined?3:tries;
  var last;
  for(var i=0;i<tries;i++){
    try{
      var res=await fetch(url);
      if(!res.ok)throw new Error('http '+res.status);
      return await res.json();
    }catch(e){
      last=e;
      if(i<tries-1)await new Promise(function(r){setTimeout(r,500*(i+1));});
    }
  }
  throw last;
}
async function searchOFF(query){

  var data=await fetchJSON(url);

async function searchFDC(query,key){

    +'&query='+encodeURIComponent(query)+'&pageSize=25';

  });

  return out.slice(0,20);

// the qrcode library is a real download (barcode decoding engine) that almost
// nobody needs every session — load it on first scan instead of on every page
// load, and only once even if the scanner gets opened/closed/reopened.
var scannerScriptPromise=null;
function loadScannerScript(){
  if(typeof Html5Qrcode!=='undefined')return Promise.resolve();
  if(scannerScriptPromise)return scannerScriptPromise;
  scannerScriptPromise=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload=function(){resolve();};
    s.onerror=function(){scannerScriptPromise=null;reject(new Error('scanner script failed to load'));};
    document.head.appendChild(s);
  });
  return scannerScriptPromise;
}
function openScanner(){
  loadScannerScript().then(function(){
    var overlay=document.createElement('div');
    overlay.id='scanoverlay';overlay.className='scanoverlay';
    overlay.innerHTML='<div class="scanbox"><div class="scanhead"><span>Scan a barcode</span><button type="button" id="scancancel">×</button></div><div id="reader"></div><div class="scanhint" id="scanhint">Point your camera at the barcode.</div></div>';
    document.body.appendChild(overlay);
    document.getElementById('scancancel').addEventListener('click',closeScanner);
    var qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]});
    window.__activeScanner=qr;
    qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},
      function(decodedText){onBarcodeScanned(decodedText);},
      function(){}
    ).catch(function(err){
      var hint=document.getElementById('scanhint');
      if(hint)hint.textContent='Could not access the camera — check camera permission for this site.';
    });
  }).catch(function(){
    alert('Scanner failed to load — check your connection and try again.');
  });
}
function closeScanner(){
  var qr=window.__activeScanner,overlay=document.getElementById('scanoverlay'),removed=false;
  function remove(){if(removed)return;removed=true;if(overlay&&overlay.parentNode)overlay.parentNode.removeChild(overlay);window.__activeScanner=null;}
  if(qr){
    // qr.stop() can hang indefinitely if the camera never actually started (e.g. permission
    // denied) — don't trust it to always settle, back it with a hard timeout either way
    try{qr.stop().then(function(){try{qr.clear();}catch(e){}remove();}).catch(remove);}catch(e){remove();}
    setTimeout(remove,1200);
  }
  else remove();
}

  var f=calcFood(r);if(!f)return null;

function calcTotals(){
  var t={calories:0,protein:0,carbs:0,fat:0};
  calcRows.forEach(function(r){var m=calcRowMacros(r);if(m)MACROS.forEach(function(k){t[k]+=m[k];});});

// Non-negative least squares by projected gradient. Small enough (at most a
// handful of foods against four macros) that a closed-form solve isn't worth
// the code — and the projection step is what actually matters here.
function solveCalc(){
  var keys=MACROS.filter(function(k){return num(calcTargets[k])>0;});
  var free=[];
  calcRows.forEach(function(r,i){if(!r.pinned&&calcFood(r))free.push(i);});
  if(!keys.length||!free.length)return;
  // whatever you've already committed to comes off the target first — that's
  // what makes "I'm having exactly this much chicken" work
  var b=keys.map(function(k){
    var left=num(calcTargets[k]);
    calcRows.forEach(function(r){
      if(!r.pinned)return;
      var m=calcRowMacros(r);if(m)left-=m[k];
    });
    return left;
  });
  // Relative error, not absolute: calories run 10-40x the gram figures, so an
  // unweighted fit would optimize calories and ignore the macros entirely.
  var w=keys.map(function(k){return 1/num(calcTargets[k]);});
  var A=keys.map(function(k,ki){
    return free.map(function(i){return num(calcFood(calcRows[i])[k])*w[ki];});
  });
  var bw=b.map(function(v,ki){return v*w[ki];});
  var n=free.length,x=[],i,j,k;
  for(j=0;j<n;j++)x.push(0);
  // 1/||A||_F² is a safe step size for this gradient — guaranteed to converge
  var L=0;
  for(k=0;k<A.length;k++)for(j=0;j<n;j++)L+=A[k][j]*A[k][j];
  if(L<=0)return;
  var lr=1/L;
  for(var it=0;it<2000;it++){
    var res=[];
    for(k=0;k<A.length;k++){var s=0;for(j=0;j<n;j++)s+=A[k][j]*x[j];res.push(s-bw[k]);}
    for(j=0;j<n;j++){
      var gr=0;for(k=0;k<A.length;k++)gr+=A[k][j]*res[k];
      x[j]=Math.max(0,x[j]-lr*gr);   // the clamp is what stops it prescribing negative rice
    }
  }
  free.forEach(function(idx,jj){
    var f=calcFood(calcRows[idx]);
    calcRows[idx].amount=Math.round(x[jj]*num(f.serving)*100)/100;
  });
}

// does nothing itself — its only job is to turn that behavior on so the
// button press-pop animation actually plays on a normal tap.
document.addEventListener('touchstart',function(){},{passive:true});
// Web Audio, not <audio>: HTMLMediaElement playback (even pooled/preloaded)
// re-seeks and re-primes its pipeline on every play(), which on mobile shows
// up as ~1s of audible lag behind the tap. Decoding once into an AudioBuffer
// and firing a fresh BufferSourceNode per tap plays with ~0 latency instead.
var POP_SRC='Sounds/Life%20System%20Sounds%20-%20Pop.wav';
var POP_CTX=null,POP_BUFFER=null;
function loadPop(){
  if(POP_CTX)return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  POP_CTX=new AC();
  fetch(POP_SRC).then(function(r){return r.arrayBuffer();})
    .then(function(buf){return POP_CTX.decodeAudioData(buf);})
    .then(function(decoded){POP_BUFFER=decoded;})
    .catch(function(){});
}
// Must be born inside a real user gesture — iOS "Add to Home Screen" standalone
// mode won't unlock an AudioContext created ahead of time, even with resume()
// called later from a click. The earliest possible touch on the page creates
// it; playPop also calls this defensively in case that listener hasn't fired.
document.addEventListener('pointerdown',loadPop,{once:true,passive:true});
function playPop(){
  if(state.settings&&state.settings.sound===false)return;
  loadPop();
  if(!POP_CTX||!POP_BUFFER)return;
  if(POP_CTX.state==='suspended')POP_CTX.resume();
  var vol=(state.settings&&state.settings.volume!=null)?state.settings.volume:70;
  var src=POP_CTX.createBufferSource();
  var gain=POP_CTX.createGain();
  gain.gain.value=vol/100;
  src.buffer=POP_BUFFER;
  src.connect(gain).connect(POP_CTX.destination);
  src.start(0);
}
app.addEventListener('click',function(e){
  if(e.target.closest('button'))playPop();
  if(e.target.classList.contains('settingsoverlay')){settingsOpen=false;foodAddOpen=false;mealAddOpen=false;resetFoodDb();render();return;}
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
  if(a==='undo'){undoLast();return;}
  if(a==='exportdata'){exportData();return;}
  if(a==='importdata'){importData();return;}
  if(a==='reset'){
    if(state._rst){
      localStorage.setItem(KEY,JSON.stringify(fixState(blankState())));
      location.reload();
    }
    else{state._rst=true;render();setTimeout(function(){if(state._rst){state._rst=false;render();}},4000);}
    return;
  }
  if(a==='nav'){
    if(page!==t.dataset.page){
      // leaving the page drops any half-finished dialog rather than having it
      // reappear the next time you come back
      page=t.dataset.page;openItem=null;
      foodAddOpen=false;mealAddOpen=false;pendingFood=null;
      window.scrollTo(0,0);render();
    }
    return;
  }
  if(a==='logtab'){logTab=t.dataset.tab;openItem=null;render();return;}
  if(a==='calcpreset'){
    var p=t.dataset.p;
    calcTargets=p==='remaining'?calcRemaining():calcShareOfDay(p==='half'?0.5:p==='third'?1/3:0.25);
    calcMode=p;
    solveCalc();render();return;
  }
  if(a==='calcpin'){
    var pr=calcRows.filter(function(x){return x.id===t.dataset.id;})[0];
    if(pr){pr.pinned=!pr.pinned;solveCalc();render();}
    return;
  }
  if(a==='calcdel'){calcRows=calcRows.filter(function(x){return x.id!==t.dataset.id;});solveCalc();render();return;}
  if(a==='calclog'){calcLogAll();return;}
  if(a==='calcsave'){calcSaveAsMeal();return;}
  if(a==='togglesettings'){settingsOpen=!settingsOpen;render();}
  else if(a==='closesettings'){settingsOpen=false;render();}
  else if(a==='setswtch'){var sk=t.dataset.k;state.settings[sk]=!state.settings[sk];save();render();}
  else if(a==='hdel'){state.health.entries=(state.health.entries||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='openfoodadd'){openFoodForm(null);}
  else if(a==='closefoodadd'){foodAddOpen=false;pendingFood=null;resetFoodDb();render();}
  else if(a==='foodadd'){addFood();}
  else if(a==='scanbarcode'){openScanner();}
  else if(a==='fdbsearch'){runFoodDbSearch();}
  else if(a==='fdbpick'){
    var picked=foodDbResults&&foodDbResults[parseInt(t.dataset.idx,10)];
    if(picked)fillFoodForm(picked);
  }
  else if(a==='togglefood'){openItem=isOpenItem('food',t.dataset.id)?null:{type:'food',id:t.dataset.id};render();}
  else if(a==='foodmode'){
    var fmd=fFood(t.dataset.id);
    // the number typed under the old mode means something different under the new one
    // (grams needed vs. grams on hand) — clear it rather than carry over a stale value
    if(fmd&&fmd.mode!==t.dataset.mode){fmd.mode=t.dataset.mode;fmd.tamt='';save();render();}
  }
  else if(a==='foodquicklog'){
    var fq=fFood(t.dataset.id);
    // nothing dialed in yet (fresh food, tamt never set) — open it instead of
    // logging nothing, since there's no amount to actually log
    if(fq&&foodResolved(fq))addFoodLog(t.dataset.id);
    else{openItem={type:'food',id:t.dataset.id};render();}
  }
  else if(a==='fooddel'){state.health.foods=(state.health.foods||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='foodlog'){addFoodLog(t.dataset.id);}
  else if(a==='logdel'){state.health.log=(state.health.log||[]).filter(function(x){return x.id!==t.dataset.id;});syncTodayMacros();save();render();}
  else if(a==='logdelgroup'){state.health.log=(state.health.log||[]).filter(function(x){return x.gid!==t.dataset.gid;});syncTodayMacros();save();render();}
  else if(a==='endday'){
    syncTodayMacros();
    var todayK=todayStr();
    state.health.log=(state.health.log||[]).filter(function(x){return x.date!==todayK;});
    save();render();
  }
  else if(a==='endperiod'){
    var pe=(state.health.entries||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
    if(pe.length){
      state.health.periods=state.health.periods||[];
      state.health.periods.push({id:uid(),startDate:pe[0].date,endDate:pe[pe.length-1].date,days:pe.length,
        avgWeight:avgField(pe,'weight'),avgCalories:avgField(pe,'calories'),avgProtein:avgField(pe,'protein')});
      state.health.entries=[];
      save();render();
    }
  }
  else if(a==='delperiod'){state.health.periods=(state.health.periods||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='openmealadd'){mealAddOpen=true;render();}
  else if(a==='closemealadd'){mealAddOpen=false;render();}
  else if(a==='addmeal'){addMeal();}
  else if(a==='togglemeal'){openItem=isOpenItem('meal',t.dataset.id)?null:{type:'meal',id:t.dataset.id};render();}
  else if(a==='dmeal'){state.health.meals=(state.health.meals||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='emln'){state.editing='ml:'+t.dataset.id;render();}
  else if(a==='logmeal'){logMeal(t.dataset.id);}
  else if(a==='midel'){var dm=fMeal(t.dataset.mid);if(dm){dm.items=(dm.items||[]).filter(function(x){return x.id!==t.dataset.iid;});save();render();}}
  else if(a==='mitemmode'){
    var mmm=fMeal(t.dataset.mid);
    var mit2=mmm&&(mmm.items||[]).filter(function(x){return x.id===t.dataset.iid;})[0];
    // same reset rationale as the standalone food toggle — the old number meant
    // something different under the old mode, so don't carry it over
    if(mit2){mit2.mode=mit2.mode==='have'?'want':'have';mit2.tamt='';save();render();}
  }
});

app.addEventListener('keydown',function(e){var t=e.target,a=t.dataset&&t.dataset.a;
  if(e.key==='Enter'){
    if(a==='fnew'){e.preventDefault();addFood();}
    else if(a==='mealn'){e.preventDefault();addMeal();}
    else if(a==='fdbquery'){e.preventDefault();runFoodDbSearch();}
    else if(['tdcommit','cmln'].indexOf(a)>-1){e.preventDefault();t.blur();}
  }else if(e.key==='Escape'){state.editing=null;render();}
});
app.addEventListener('input',function(e){var t=e.target,a=t.dataset&&t.dataset.a;
  if(a==='setrange'){state.settings[t.dataset.k]=parseInt(t.value,10);save();return;}
  if(a==='hfield'){var v=t.value;var fv=t.type==='number'?(v===''?'':parseFloat(v)):v;upsertHealth(todayStr(),t.dataset.field,fv);save();refreshHealth();return;}
  if(a==='hedit'){var he=(state.health.entries||[]).filter(function(x){return x.id===t.dataset.id;})[0];if(he){var v2=t.value;he[t.dataset.field]=t.type==='number'?(v2===''?'':parseFloat(v2)):v2;save();refreshHealth();}return;}
  if(a==='foodamt'){var fd=fFood(t.dataset.id);if(fd){fd.tamt=t.value;save();refreshFoodCard(fd.id);}return;}
  if(a==='mealmult'){var mm=fMeal(t.dataset.id);if(mm){mm.mult=t.value===''?'':parseFloat(t.value);save();refreshMeal(mm.id);}return;}
  if(a==='mealwant'){var mw=fMeal(t.dataset.id);if(mw){mw.wantAmt=t.value;applyMealWant(mw);save();refreshMeal(mw.id);}return;}
  if(a==='mitemamt'){
    var im=fMeal(t.dataset.mid);
    if(im){var it=(im.items||[]).filter(function(x){return x.id===t.dataset.iid;})[0];if(it){it.tamt=t.value;save();refreshMeal(im.id);}}
    return;
  }
  if(a==='fdbquery'){foodDbQuery=t.value;return;}
  if(a==='fdckey'){state.settings.fdcKey=t.value.trim();save();return;}
  if(a==='calctarget'){calcTargets[t.dataset.k]=t.value===''?'':parseFloat(t.value);calcMode='';refreshCalc();return;}
  if(a==='calcamt'){
    var cr=calcRows.filter(function(x){return x.id===t.dataset.id;})[0];
    // typing an amount IS the pin — you're saying you've already decided this one
    if(cr){cr.amount=t.value===''?'':parseFloat(t.value);cr.pinned=true;refreshCalc();}
    return;
  }
  if(a==='calcadd'){
    var fid=t.value;if(!fid)return;
    calcRows.push({id:uid(),foodId:fid,amount:'',pinned:false});
    solveCalc();render();
    return;
  }
  if(a==='goalfield'){
    // refresh only the bars, not the whole page — a render() here would pull
    // focus out of the field mid-keystroke
    state.health.goals[t.dataset.k]=t.value===''?'':parseFloat(t.value);
    if(t.dataset.k==='weight')state.health.targetWeight=t.value===''?'':parseFloat(t.value);
    save();refreshGoalCheck();
    return;
  }
  if(a==='foodsearch'){
    // filter in the DOM rather than re-rendering, so typing doesn't lose focus —
    // but remember the query so a render triggered by something else (e.g.
    // mis-tapping a food card) restores it instead of silently clearing it
    foodSearchQuery=t.value;
    applyFoodSearch();
    return;
  }
  return;});
app.addEventListener('change',function(e){var t=e.target,a=t.dataset&&t.dataset.a;
  if(t.id==='importfile'){handleImportFile(t.files&&t.files[0]);return;}
  if(a==='setfield'){state.settings[t.dataset.k]=t.value;save();return;}
  if(a==='fnew'&&t.dataset.f==='unit'){
    // switching to a countable unit (scoop/slice/bar/packet/serving) mid-entry — the macros
    // already scanned/typed represent whatever the old serving was, so just re-anchor the
    // serving number to 1 rather than leaving a stale "30" sitting next to "scoop"
    if(isCountableUnit(t.value)){
      var servingInput=app.querySelector('[data-a="fnew"][data-f="serving"]');
      if(servingInput)servingInput.value='1';
    }
    return;
  }
  if(a==='foodmac'){var fd=fFood(t.dataset.id);if(fd){fd.tmac=t.value;save();refreshFoodCard(fd.id);}}
  if(a==='mealwantmac'){var mwm=fMeal(t.dataset.id);if(mwm){mwm.wantMac=t.value;applyMealWant(mwm);save();render();}}
  if(a==='mitemmac'){
    var mmc=fMeal(t.dataset.mid);
    if(mmc){var mit=(mmc.items||[]).filter(function(x){return x.id===t.dataset.iid;})[0];if(mit){mit.tmac=t.value;save();refreshMeal(mmc.id);}}
    return;
  }
  if(a==='mealadditem'){
    var am=fMeal(t.dataset.id),af=fFood(t.value);
    if(am&&af){var d=defaultTarget(af);am.items=am.items||[];am.items.push({id:uid(),foodId:af.id,tmac:d.tmac,tamt:d.tamt,mode:af.mode==='have'?'have':'want'});save();render();}
    else t.value='';
    return;
  }
});
app.addEventListener('blur',function(e){var t=e.target,a=t.dataset&&t.dataset.a;if(!a)return;
  if(a==='cmln'){var ml=fMeal(t.dataset.id);var mv=t.value.trim();if(ml&&mv)ml.name=mv;state.editing=null;save();render();}
},true);

(async function(){state=await loadState();UNDO.push(JSON.stringify(state));render();})();
})();
</script>
