/* ============================================================
   PALETTE — every color in the app is one of these roles.
   To re-theme: edit only this block. Everything below reads
   roles (--surface, --accent, --on-ground…), never raw hex.
   The <meta name="theme-color"> tag in <head> can't read CSS
   variables, so it must be updated by hand to match --ground.
   ============================================================ */
:root{
  /* ground: the page background, and text/borders that sit directly on it (no card).
     The ground is LIGHT and blocks are DARK, so on-ground text is the darkest green. */
  --ground:#daf1de;              /* mint */
  --ground-alt:#8eb69b;          /* sage — alternates with --ground band to band */
  --on-ground:#051f20;           /* darkest green — text on either ground color */
  --on-ground-outline:rgba(5,31,32,.35);
  --on-ground-wash:rgba(5,31,32,.08);
  --on-ground-negative:#8f2f22;  /* --negative is too light to read on the pale ground; darker stand-in */
  --on-ground-negative-wash:rgba(143,47,34,.12);

  /* surface: block backgrounds and their text tiers. Nothing is outlined — depth
     is the only separator, so these three tones must stay distinguishable:
     a block is lightest, a control inside it is darker, a field is darkest. */
  --surface:#235347;             /* every block */
  --surface-2:#163832;           /* inset within a block: buttons, panels, table head/total rows */
  --surface-3:#0b2b26;           /* deepest: form fields, and the 1px gaps used as rules */
  --surface-wash:rgba(218,241,222,.16);  /* translucent light fill on a block (e.g. XP bar track) */
  --on-surface:#daf1de;          /* mint — primary text on a block */
  --on-surface-dim:#b3d4bd;      /* secondary text on a block */
  --on-surface-faint:#8eb69b;    /* tertiary/muted text on a block */
  --divider:#0b2b26;             /* shown through grid/flex gaps, never as a border */

  /* accent: interactive/brand colors — accent is the default, 2 and 3 are alternates
     (per-goal color, macro donut slices). Accents sit on dark blocks, so they run light. */
  --accent:#8eb69b;
  --accent-2:#daf1de;
  --accent-3:#4e8f79;
  --accent-wash:rgba(142,182,155,.14);
  --on-accent:#051f20;           /* text/icon on a filled accent background */

  /* status — derived, not from the source palette: a six-tone monochrome can't
     signal good/bad on its own, and danger in particular has to read as danger. */
  --positive:#7fd1a5;
  --negative:#e0796b;
  --negative-wash:rgba(224,121,107,.14);

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{background:var(--ground);margin:0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
/* Sections alternate cognac <-> amber; the color change IS the divider, so no rules.
   Negative margins pull each band out to the viewport edges while the matching
   padding puts its content back on the centered column. */
.band{margin:0 calc(50% - 50vw);padding:16px calc(50vw - 50%)}
.band.alt{background:var(--ground-alt)}
/* Routines with no goal render bare on the ground — give them a card so their
   text matches every other block instead of needing a light/dark exception. */
.band>.rchklist{border-radius:20px;background:var(--surface);padding:12px 14px}
#app{color:var(--on-surface);font-family:var(--sans);line-height:1.5;max-width:920px;margin:0 auto;padding:8px 16px 40px}
#app *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app h1,#app h2,#app h3{margin:0;font-weight:600;letter-spacing:-.01em}
#app p{margin:0}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation}
.plusicon{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.15em;margin-right:.3em;background-color:currentColor;
  -webkit-mask:url(Images/Plus.png?v=2) center/contain no-repeat;mask:url(Images/Plus.png?v=2) center/contain no-repeat}
button:active{transform:scale(1.08)}
input,textarea,select{background:var(--surface-3);border:none;color:var(--on-surface);border-radius:12px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 2px var(--ac,var(--accent))}
input[type=time],input[type=date]{color-scheme:dark;font-family:var(--mono);font-size:13px}
input::placeholder,textarea::placeholder{color:var(--on-surface-faint);opacity:1}
input[type=checkbox]{width:auto;accent-color:var(--ac,var(--accent))}
textarea{resize:vertical;min-height:52px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-surface-dim);padding:4px 2px 10px}
.topbar{display:flex;align-items:center;gap:8px}
.tabbar{display:flex;flex:1;gap:6px;padding-bottom:12px;margin-bottom:4px;flex-wrap:wrap}
/* Unselected tabs sit bare on the ground; selecting one fills it. The icons are
   masks painted with currentColor, so they follow the label in either state. */
.tab{font-family:var(--sans);font-weight:600;letter-spacing:-.01em;font-size:16px;padding:9px 17px;border-radius:14px;background:none;color:var(--on-ground);display:inline-flex;align-items:center;gap:7px}
.tab:hover{background:var(--on-ground-wash)}
.tab.on{background:var(--surface);color:var(--on-surface)}
.tabicon,.mobiledropicon{flex:none;background-color:currentColor;
  -webkit-mask:var(--icon) center/contain no-repeat;mask:var(--icon) center/contain no-repeat}
.tabicon{width:22px;height:22px}
.mobiledropitem{display:inline-flex;align-items:center;gap:8px}
.mobiledropicon{width:24px;height:24px}
/* Only the PNGs' alpha is used, so their own color is irrelevant. Without mask
   support the fill would paint as a solid square — blank it instead. */
@supports not ((-webkit-mask-image:url(#i)) or (mask-image:url(#i))){
  .tabicon,.mobiledropicon,.plusicon{background-color:transparent}
}
.settingsbtn{flex:none;width:40px;height:40px;border-radius:12px;background:none;color:var(--on-ground);display:flex;align-items:center;justify-content:center}
.settingsbtn:hover{background:var(--on-ground-wash)}
.settingsbtn svg{width:22px;height:22px;fill:currentColor}
/* Settings is a popover, not a page — it blurs and dims whatever's behind it. */
.settingsoverlay{position:fixed;inset:0;background:rgba(5,31,32,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.settingscard{background:var(--surface);border-radius:22px;padding:20px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto}
.settingscard.wide{max-width:460px}

.setrange{width:120px;flex:none;accent-color:var(--accent)}
/* toggle switch */
.swtch{width:44px;height:26px;border-radius:999px;background:var(--surface-3);flex:none;position:relative;padding:0;transition:background .15s}
.swtch:before{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--on-surface-faint);transition:transform .15s,background .15s}
.swtch.on{background:var(--accent-wash)}
.swtch.on:before{transform:translateX(18px);background:var(--accent)}
.hamburger{display:none}
@media(max-width:680px){
  .tabbar{display:none}
  .topbar{margin-bottom:8px}
  .hamburger{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-family:var(--mono);font-size:13px;border-radius:16px;padding:11px 13px;color:var(--on-ground);background:var(--on-ground-wash)}
  .hamlabel{color:var(--on-ground)}

  .mobiledropitem:hover{background:var(--surface-3)}
  .mobiledropitem.on{background:var(--surface);color:var(--on-surface);font-weight:600}
}

.s-Saved{border-left:3px solid var(--on-surface-faint)}.s-Applied{border-left:3px solid var(--accent-3)}.s-Phonescreen{border-left:3px solid var(--accent)}.s-Interview{border-left:3px solid var(--accent-2)}.s-Offer{border-left:3px solid var(--positive)}.s-Rejected{border-left:3px solid var(--negative);opacity:.7}

function fixState(d){
  d.view=d.view||{page:'tree'};d.tab=d.tab||'goals';d.editing=null;
  if(!d.settings)d.settings={};
  if(d.settings.sound===undefined)d.settings.sound=true;
  if(!d.goals)d.goals=JSON.parse(JSON.stringify(SEED.goals));
  if(!d.routines)d.routines=JSON.parse(JSON.stringify(SEED.routines));
  ensureTodos(d);
  var DF={spend:0,wrate:4,nominal:7,inflation:3,assets:0,monthlyInvest:0,targetDate:''};
  d.finance=d.finance||{};if(d.finance.nominal===undefined){var _rr=parseFloat(d.finance.realReturn);if(!isNaN(_rr)){d.finance.nominal=_rr+3;d.finance.inflation=3;}}delete d.finance.realReturn;Object.keys(DF).forEach(function(k){if(d.finance[k]===undefined)d.finance[k]=DF[k];});
  if(d.finance.targetDate===undefined){
    if(d.finance.targetAge&&d.finance.age){var yr=new Date().getFullYear()+(parseFloat(d.finance.targetAge)-parseFloat(d.finance.age));d.finance.targetDate=yr+'-01-01';}
    else d.finance.targetDate='2041-01-01';
  }
  if(d.finance.monthlyInvest===undefined)d.finance.monthlyInvest=0;
  delete d.finance.age;delete d.finance.targetAge;delete d.finance.investPct;delete d.finance.propSurplus;
  if(!d.finance.income)d.finance.income=[];
  if(!d.finance.expenses)d.finance.expenses=[];
  if(!d.health)d.health={};
  if(!d.health.entries)d.health.entries=[];
  if(!d.health.foods)d.health.foods=[];
  (d.health.foods||[]).forEach(function(f){if(!f.unit)f.unit='g';});
  if(!d.health.meals)d.health.meals=[];
  (d.health.meals||[]).forEach(function(m){
    if(m.mult===undefined||m.mult==='')m.mult=1;
    if(!m.items)m.items=[];
  });
  if(!d.health.log)d.health.log=[];
  (d.health.log||[]).forEach(function(r){
    // rows used to assume grams; keep the number, name the unit
    if(r.qty===undefined){r.qty=r.grams===undefined?0:r.grams;r.unit=r.unit||'g';delete r.grams;}
  });
  if(d.health.targetWeight===undefined)d.health.targetWeight=200;
  if(!d.todoOpenDays)d.todoOpenDays=[];
  if(d.trackers&&d.trackers.length){
    // one-time migration: old standalone habit trackers fold into routines so no check-in history is lost
    d.trackers.forEach(function(tr){
      d.routines=d.routines||[];
      d.routines.push({id:'r_'+uid(),goalId:tr.goalId||null,title:tr.title,cadence:(tr.cadence||[]).length===7?'daily':(tr.cadence||[]).join('/'),active:true,note:'',blocks:(tr.cadence&&tr.cadence.length)?[{id:uid(),days:tr.cadence.slice(),start:'',end:''}]:[],dates:(tr.dates||[]).slice()});
    });
  }
  delete d.trackers;
  if(!d.sleep)d.sleep={wake:'07:00',bed:'22:30'};
  var legacyBoundsR=(d.routines||[]).filter(function(r){return r.bounds;})[0];
  if(legacyBoundsR){
    // one-time: the old "Sleep routine" concept folds into a plain wake/bed setting, not a trackable habit
    var b0=(legacyBoundsR.blocks||[])[0];
    if(b0){d.sleep.wake=b0.end||d.sleep.wake;d.sleep.bed=b0.start||d.sleep.bed;}
    d.routines=(d.routines||[]).filter(function(r){return r!==legacyBoundsR;});
  }
  (d.routines||[]).forEach(function(r){
    if(r.active===undefined)r.active=true;
    r.log=undefined; // strip old log data
    delete r.bounds;
    if(!r.dates)r.dates=[];
    if(!r.difficulty||typeof r.difficulty==='string'){var _dm={easy:1,medium:3,hard:4,brutal:5};r.difficulty=_dm[r.difficulty]||3;}
    r.blocks=(r.blocks||[]).map(function(b){
      // migrate old single-day blocks
      if(!b.days&&b.day)b.days=[b.day];
      if(!b.start&&b.startH!==undefined)b.start=String(b.startH).padStart(2,'0')+':00';
      if(!b.end&&b.endH!==undefined)b.end=String(b.endH).padStart(2,'0')+':00';
      if(!b.days)b.days=[];
      return b;
    });
  });
  return d;
}
async function loadState(){
  // 1) your saved data always wins
  try{var r=localStorage.getItem(KEY);if(r)return fixState(JSON.parse(r));}catch(e){}
  // 2) one-time import from any older key
  for(var i=0;i<LEGACY.length;i++){
    try{
      var old=localStorage.getItem(LEGACY[i]);
      if(old){var d=fixState(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(d));return d;}
    }catch(e){}
  }
  // 3) genuinely empty -> seed
  return fixState(JSON.parse(JSON.stringify(SEED)));
}
var UNDO=[];var UNDOING=false;
async function save(){
  try{
    var c=JSON.parse(JSON.stringify(state));c.editing=null;delete c._rst;
    if(!UNDOING){UNDO.push(JSON.stringify(c));if(UNDO.length>20)UNDO.shift();}
    localStorage.setItem(KEY,JSON.stringify(c));
  }catch(e){}
}
async function undoLast(){
  if(UNDO.length<2)return;
  UNDO.pop(); // discard current
  var prev=UNDO[UNDO.length-1];
  UNDOING=true;
  state=JSON.parse(prev);
  await save();
  UNDOING=false;
  render();
}

function handleImportFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    var parsed;
    try{parsed=JSON.parse(reader.result);}catch(e){alert('That file isn’t valid — it doesn’t look like a Life System backup.');return;}
    if(!parsed||typeof parsed!=='object'){alert('That file isn’t valid — it doesn’t look like a Life System backup.');return;}
    if(!confirm('This replaces everything currently in the app with what’s in this file. This can’t be undone. Continue?'))return;
    var fixed=fixState(parsed);
    localStorage.setItem(KEY,JSON.stringify(fixed));
    location.reload();
  };
  reader.onerror=function(){alert('Couldn’t read that file.');};
  reader.readAsText(file);
}

function subOf(id){var m=allSubs().filter(function(x){return x.s.id===id;})[0];return m||null;}

  if(!d.todos){

function dateOnly(x){var d=new Date(x+'T00:00:00');return isNaN(d)?null:d;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtShort(dateStr){var d=new Date(dateStr+'T00:00:00');if(isNaN(d))return dateStr;return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function sProg(s){var a=todosFor(s.id);if(!a.length)return 0;return a.filter(function(x){return x.done;}).length/a.length;}

function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekDays(){var now=new Date();now.setHours(0,0,0,0);var dy=now.getDay();var diff=dy===0?-6:1-dy;var mon=new Date(now);mon.setDate(now.getDate()+diff);var out=[];for(var i=0;i<7;i++){var d2=new Date(mon);d2.setDate(mon.getDate()+i);out.push({key:dkey(d2),lab:DAYS[i],num:d2.getDate(),today:dkey(d2)===dkey(now)});}return out;}

// routine check-ins — a routine's own time blocks ARE its schedule; no separate habit concept
function dayAbbr(d){return DAYS[(d.getDay()+6)%7];}
function rScheduled(r,d){
  var blocks=r.blocks||[];
  if(!blocks.length)return true; // no fixed time block -> no day restriction, checkable any day
  var abbr=dayAbbr(d);
  return blocks.some(function(b){return (b.days||[]).indexOf(abbr)>-1;});
}
function blockWindowPassed(b,nowH){
  if(!b.start||!b.end)return true;
  var sh=t2h(b.start),eh=t2h(b.end);
  if(eh<=sh)return nowH>=sh; // overnight block (e.g. sleep) — "possible" once it begins
  return nowH>=eh; // same-day block — only possible once the window has actually elapsed
}
function checkinGate(r){
  // 'open' = can check in now, 'pending' = scheduled today but window hasn't happened yet, 'off' = not scheduled today
  var blocks=r.blocks||[];
  if(!blocks.length)return 'open';
  var abbr=dayAbbr(todayDate());
  var todays=blocks.filter(function(b){return (b.days||[]).indexOf(abbr)>-1;});
  if(!todays.length)return 'off';
  var now=new Date();var nowH=now.getHours()+now.getMinutes()/60;
  return todays.some(function(b){return blockWindowPassed(b,nowH);})?'open':'pending';
}
function nextWindowLabel(r){
  var abbr=dayAbbr(todayDate());
  var now=new Date();var nowH=now.getHours()+now.getMinutes()/60;
  var upcoming=(r.blocks||[]).filter(function(b){return (b.days||[]).indexOf(abbr)>-1;})
    .map(function(b){var sh=t2h(b.start),eh=t2h(b.end);return eh<=sh?sh:eh;})
    .filter(function(h){return h>nowH;}).sort(function(a,b){return a-b;});
  if(!upcoming.length)return 'later';
  var h=Math.floor(upcoming[0]),m=Math.round((upcoming[0]%1)*60);
  return 'opens '+fmtT(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
}
function rStreak(r){
  var set={};(r.dates||[]).forEach(function(x){set[x]=true;});
  var streak=0,cur=todayDate();
  for(var i=0;i<400;i++){
    var key=dkey(cur);
    if(rScheduled(r,cur)){
      if(set[key])streak++;
      else if(i>0)break;
    }
    cur.setDate(cur.getDate()-1);
  }
  return streak;
}
function rLongest(r){
  var now=rStreak(r);
  if(!r.dates||!r.dates.length)return now;
  var set={};r.dates.forEach(function(x){set[x]=true;});
  var sorted=r.dates.slice().sort();
  var d=dateOnly(sorted[0]),end=todayDate();
  if(!d)return now;
  var best=0,cur=0,guard=0;
  while(d<=end&&guard<2000){
    if(rScheduled(r,d)){
      if(set[dkey(d)]){cur++;if(cur>best)best=cur;}
      else cur=0;
    }
    d.setDate(d.getDate()+1);guard++;
  }
  return Math.max(best,now);
}
var DIFF=[{level:1,xp:10},{level:2,xp:20},{level:3,xp:30},{level:4,xp:40},{level:5,xp:50}];
function diffInfo(level){return DIFF.filter(function(d){return d.level===level;})[0]||DIFF[2];}
function perfectDays(){
  // a date is "perfect" when every currently-active routine scheduled that day was checked in
  var routines=(state.routines||[]).filter(function(r){return r.active!==false;});
  if(!routines.length)return [];
  var dateSet={};
  routines.forEach(function(r){(r.dates||[]).forEach(function(dt){dateSet[dt]=true;});});
  return Object.keys(dateSet).filter(function(dt){
    var d=dateOnly(dt);if(!d)return false;
    var scheduled=routines.filter(function(r){return rScheduled(r,d);});
    if(!scheduled.length)return false;
    return scheduled.every(function(r){return (r.dates||[]).indexOf(dt)>-1;});
  });
}
var PERFECT_DAY_XP=25;
var TODO_OPEN_XP=1,TODO_CREATE_XP=1,TODO_DONE_XP=3;
function totalXP(){
  var x=0;
  (state.routines||[]).forEach(function(r){
    var di=diffInfo(r.difficulty);
    x+=(r.dates||[]).length*di.xp+rLongest(r)*Math.round(di.xp*0.2);
  });
  x+=perfectDays().length*PERFECT_DAY_XP;
  x+=(state.todos||[]).length*TODO_CREATE_XP;
  x+=(state.todos||[]).filter(function(t){return t.done;}).length*TODO_DONE_XP;
  x+=(state.todoOpenDays||[]).length*TODO_OPEN_XP;
  return x;
}
function levelInfo(){
  var xp=totalXP(),lvl=1,need=50;
  while(xp>=need){xp-=need;lvl++;need=50*lvl;}
  return {level:lvl,into:xp,need:need};
}

// Wrap each page section in a band so the ground alternates cognac/amber.
// A new band starts at every .ph section header; the color change replaces divider rules.
var BANDSKIP=['brand','topbar','mobiledrop','settingsoverlay'];
function applyBands(){
  var kids=[].slice.call(app.children),alt=false,started=false,cur=null;
  kids.forEach(function(el){
    if(BANDSKIP.some(function(c){return el.classList.contains(c);})){cur=null;return;}
    var head=el.classList.contains('ph');
    if(head||!cur){
      if(head&&started)alt=!alt;
      started=true;
      cur=document.createElement('div');
      cur.className='band'+(alt?' alt':'');
      app.insertBefore(cur,el);
    }
    cur.appendChild(el);
  });
}

function routineCheckRow(r){
  var streak=rStreak(r);
  var done=(r.dates||[]).indexOf(dkey(todayDate()))>-1;
  var gate=done?'open':checkinGate(r);
  var atRisk=!done&&gate==='open'&&streak>0;
  var label,cls,disabled='';
  if(done){label='✓ Checked in';cls='done';}

function money(n){if(!isFinite(n))return'\u2014';var neg=n<0;n=Math.abs(Math.round(n));var s=n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'-$':'$')+s;}
function sumList(a){var t=0;(a||[]).forEach(function(x){var v=parseFloat(x.amt);if(!isNaN(v))t+=v;});return t;}
function todayDate(){var d=new Date();d.setHours(0,0,0,0);return d;}
function yearsUntil(dateStr){var t=new Date(dateStr+'T00:00:00');if(isNaN(t))return 0;return (t-todayDate())/(365.25*24*3600*1000);}
function fmtDate(dateStr){var t=new Date(dateStr+'T00:00:00');if(isNaN(t))return dateStr;return t.toLocaleDateString(undefined,{year:'numeric',month:'short'});}
function calcFin(){
  var f=state.finance;
  var inc=sumList(f.income), exp=sumList(f.expenses);
  var surplus=inc-exp;
  var monthly=parseFloat(f.monthlyInvest)||0;
  var annualInvest=monthly*12;
  var nom=(parseFloat(f.nominal)||0)/100;
  var infl=(parseFloat(f.inflation)||0)/100;
  var wr=(parseFloat(f.wrate)||4)/100;
  var spend0=parseFloat(f.spend)||0;
  var A=parseFloat(f.assets)||0;
  var yrs=Math.max(0,yearsUntil(f.targetDate));
  function port(t){if(nom===0)return A+annualInvest*t;return A*Math.pow(1+nom,t)+annualInvest*(Math.pow(1+nom,t)-1)/nom;}
  function inflSpend(t){return spend0*Math.pow(1+infl,t);}
  function needAt(t){return inflSpend(t)/wr;}
  var spendAtTarget=inflSpend(yrs);
  var need=needAt(yrs);
  var atTarget=port(yrs);
  var fiYears=null;
  if(port(0)>=needAt(0))fiYears=0;
  else if(annualInvest>0||A>0){for(var t=0.25;t<=70;t+=0.25){if(port(t)>=needAt(t)){fiYears=t;break;}}}
  var fiDate=null,fiNeed=null;
  if(fiYears!==null){var d=todayDate();d.setDate(d.getDate()+Math.round(fiYears*365.25));fiDate=d;fiNeed=needAt(fiYears);}
  var reqMonthly=null;
  if(yrs>0){
    var futureA=A*Math.pow(1+nom,yrs);
    if(futureA>=need)reqMonthly=0;
    else{
      var reqAnnual=nom===0?(need-futureA)/yrs:(need-futureA)*nom/(Math.pow(1+nom,yrs)-1);
      reqMonthly=Math.max(0,reqAnnual/12);
    }
  }
  return {inc:inc,exp:exp,surplus:surplus,monthly:monthly,annualInvest:annualInvest,spend0:spend0,spendAtTarget:spendAtTarget,need:need,atTarget:atTarget,fiYears:fiYears,fiDate:fiDate,fiNeed:fiNeed,yrs:yrs,reqMonthly:reqMonthly};
}
function finOut(){
  var f=state.finance,k=calcFin();
  var infl=parseFloat(f.inflation)||0;
  var big,unit,verdict;
  if(k.atTarget<=0&&k.annualInvest<=0){big='\u2014';unit='set a monthly contribution to project';verdict='Nothing\'s going in yet. Enter a monthly contribution and this projects where you land.';}
  else{
    big=money(k.atTarget);unit='projected balance by '+fmtDate(f.targetDate);
    if(k.fiDate){
      var fy=k.fiDate.getFullYear(),fm=k.fiDate.toLocaleDateString(undefined,{month:'short'});
      verdict='At '+money(k.monthly)+'/mo you cross financial independence (\u2248'+money(k.fiNeed)+' at that point) around <b>'+fm+' '+fy+'</b>.';
    } else {
      verdict='At '+money(k.monthly)+'/mo you don\'t reach independence within 70 years. Raise the monthly number to pull it in.';
    }
  }
  var inflbox='<div class="inflbox">Your <b>'+money(k.spend0)+'</b>/yr of spending today grows to about <b>'+money(k.spendAtTarget)+'</b>/yr by '+fmtDate(f.targetDate)+' at '+infl+'% inflation. The nest egg is sized from that future amount: <b>'+money(k.need)+'</b>.</div>';
  var sCls=k.surplus>=0?'good':'bad';
  var vsSurplus=k.surplus-k.monthly;
  var vsNote;
  if(k.monthly<=0)vsNote='You\'re investing nothing yet. Your surplus is '+money(k.surplus)+'/mo \u2014 the ceiling on what you could put in.';
  else if(vsSurplus>=0)vsNote='Investing '+money(k.monthly)+' of a '+money(k.surplus)+' surplus \u2014 '+money(vsSurplus)+'/mo to spare.';
  else vsNote='Investing '+money(k.monthly)+' but surplus is only '+money(k.surplus)+' \u2014 '+money(-vsSurplus)+'/mo short, drawing down to cover it.';
  var reqNote;
  if(k.reqMonthly===null)reqNote='Set a target date in the future to see what monthly contribution it takes.';
  else if(k.reqMonthly===0)reqNote='Your current assets alone are already projected to clear the nest egg by the target date \u2014 you could invest $0/mo and still get there.';
  else{
    var diff=k.monthly-k.reqMonthly;
    if(diff>=0)reqNote='<b>'+money(k.reqMonthly)+'/mo</b> is what it takes to hit the nest egg by '+fmtDate(f.targetDate)+'. You\'re at '+money(k.monthly)+' \u2014 '+money(diff)+'/mo ahead of pace.';
    else reqNote='<b>'+money(k.reqMonthly)+'/mo</b> is what it takes to hit the nest egg by '+fmtDate(f.targetDate)+'. You\'re at '+money(k.monthly)+' \u2014 '+money(-diff)+'/mo short of that pace.';
  }
  return '<div class="bignum"><span class="n">'+big+'</span><span class="u">'+unit+'</span></div>'
    +inflbox
    +'<div class="verdict">'+verdict+'</div>'
    +'<div class="statrow">'
    +'<div class="stat neu"><div class="sl">Contributing / mo</div><div class="sv">'+money(k.monthly)+'</div></div>'
    +'<div class="stat neu"><div class="sl">Needed / mo for target</div><div class="sv">'+(k.reqMonthly===null?'\u2014':money(k.reqMonthly))+'</div></div>'
    +'<div class="stat neu"><div class="sl">Nest egg needed</div><div class="sv">'+money(k.need)+'</div></div>'
    +'</div>'
    +'<div class="statrow">'
    +'<div class="stat '+sCls+'"><div class="sl">Monthly surplus</div><div class="sv">'+money(k.surplus)+'</div></div>'
    +'</div>'
    +'<div class="lever">'+reqNote+'</div>'
    +'<div class="lever">'+vsNote+'</div>';
}

function buildSch(){
  var wk=weekDays();
  var bounds={wake:t2h(state.sleep.wake),bed:t2h(state.sleep.bed)};
  var validBounds=state.sleep.wake&&state.sleep.bed&&bounds.bed>bounds.wake;
  var all=[];
  state.routines.forEach(function(r){
    if(r.active===false)return;
    var g=fG(r.goalId);var ac=g?g.accent:'vio';
    (r.blocks||[]).forEach(function(b){(b.days||[]).forEach(function(day){all.push({r:r,b:b,ac:ac,day:day});});});
  });
  var lo,hi;
  if(validBounds){lo=Math.floor(bounds.wake);hi=Math.ceil(bounds.bed);}
  else if(all.length){
    var mins=all.map(function(x){return t2h(x.b.start);});
    var maxs=all.map(function(x){return t2h(x.b.end);});
    lo=Math.max(0,Math.floor(Math.min.apply(null,mins))-1);
    hi=Math.min(24,Math.ceil(Math.max.apply(null,maxs))+1);
  } else {lo=6;hi=22;}
  if(hi<=lo){lo=6;hi=22;}
  var n=hi-lo,PH=56,H=n*PH;
  var cols='52px '+wk.map(function(){return '1fr';}).join(' ');
  var hdr='<div class="schch"></div>'+wk.map(function(d){return '<div class="schch'+(d.today?' today':'')+'">'+d.lab+'<br>'+d.num+'</div>';}).join('');
  var sleepBar='<div class="sleepbar"><span class="sleeplbl">Sleep window</span>'
    +'<label>Bed <input type="time" data-a="sleepset" data-k="bed" value="'+esc(state.sleep.bed)+'"></label>'
    +'<label>Wake <input type="time" data-a="sleepset" data-k="wake" value="'+esc(state.sleep.wake)+'"></label></div>';
  var note=validBounds?'<div class="sub2">Showing '+fmtT(state.sleep.wake)+' \u2013 '+fmtT(state.sleep.bed)+', from the sleep window above.</div>':'<div class="sub2">Sleep window above isn\u2019t set \u2014 built from active routine time blocks instead.</div>';
  if(!all.length)return '<div class="hrow"><h1>Weekly Schedule</h1></div>'+sleepBar+note+'<div class="schgrid" style="grid-template-columns:'+cols+'"><div class="schempty">No time blocks yet.</div></div>';
  var lineBg='repeating-linear-gradient(to bottom, transparent 0px, transparent '+(PH-1)+'px, var(--divider) '+(PH-1)+'px, var(--divider) '+PH+'px)';
  var hourCol='<div class="schhours" style="height:'+H+'px;background-image:'+lineBg+'">'+(function(){var o='';for(var h=lo;h<hi;h++){o+='<div class="hlab" style="height:'+PH+'px">'+fmtT(String(h).padStart(2,'0')+':00')+'</div>';}return o;})()+'</div>';
  var dayCols=wk.map(function(d){
    var blks=all.filter(function(x){return x.day===d.lab;});
    var inner=blks.map(function(x){
      var sh=t2h(x.b.start),eh=t2h(x.b.end);
      if(eh<=sh)eh=sh+0.5;
      if(eh<lo||sh>hi)return '';
      var s=Math.max(sh,lo),e=Math.min(eh,hi);
      var top=(s-lo)*PH, ht=Math.max(14,(e-s)*PH-3);
      return '<div class="schblock" style="background:'+av(x.ac)+';color:var(--on-accent);top:'+top+'px;height:'+ht+'px">'+esc(x.r.title)+'</div>';
    }).join('');
    return '<div class="schday" style="height:'+H+'px;background-image:'+lineBg+'">'+inner+'</div>';
  }).join('');
  return '<div class="hrow"><h1>Weekly Schedule</h1></div>'+sleepBar+note
    +'<div class="schgrid" style="grid-template-columns:'+cols+';grid-template-rows:auto '+H+'px">'+hdr+hourCol+dayCols+'</div>';
}

function healthEntry(dateStr){return (state.health.entries||[]).filter(function(e){return e.date===dateStr;})[0];}
function upsertHealth(dateStr,field,val){
  state.health.entries=state.health.entries||[];
  var e=healthEntry(dateStr);
  if(!e){e={id:uid(),date:dateStr,weight:'',calories:'',protein:'',note:''};state.health.entries.push(e);}

function weightChart(entriesDesc){
  var pts=entriesDesc.filter(function(e){return e.weight!==''&&e.weight!=null&&!isNaN(parseFloat(e.weight));}).slice().reverse();
  if(pts.length<2)return '<div class="wchart empty">Log weight on at least two days to see the trend.</div>';
  var last=pts.slice(-90);
  var W=640,H=160,pad=30;
  var ws=last.map(function(e){return parseFloat(e.weight);});
  var min=Math.min.apply(null,ws),max=Math.max.apply(null,ws);
  if(min===max){min-=1;max+=1;}
  function xs(i){return pad+(i/(last.length-1))*(W-pad-10);}
  function ys(v){return H-pad+8-((v-min)/(max-min))*(H-pad-16);}
  var d=last.map(function(e,i){return (i===0?'M':'L')+xs(i).toFixed(1)+','+ys(parseFloat(e.weight)).toFixed(1);}).join(' ');
  var dots=last.map(function(e,i){return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(parseFloat(e.weight)).toFixed(1)+'" r="2.5" fill="var(--accent)"><title>'+fmtShort(e.date)+': '+e.weight+' lb</title></circle>';}).join('');
  var gridY=[min,(min+max)/2,max].map(function(v){var y=ys(v);return '<line x1="'+pad+'" x2="'+(W-4)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--divider)" stroke-width="1"/><text x="2" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--on-surface-faint)" font-family="ui-monospace,monospace">'+Math.round(v)+'</text>';}).join('');
  return '<div class="wchart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:160px">'+gridY+'<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg></div>';
}
function healthSummaryHtml(){
  var entries=(state.health.entries||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var latest=entries.filter(function(e){return e.weight!=='';})[0];
  var tw=parseFloat(state.health.targetWeight)||0;
  var curW=latest?parseFloat(latest.weight):null;
  var delta30=null;
  if(curW!==null){
    var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
    var withW=entries.filter(function(e){return e.weight!=='';});
    var past=withW.filter(function(e){return dateOnly(e.date)<=cutoff;})[0]||withW[withW.length-1];
    if(past&&past.id!==latest.id)delta30=curW-parseFloat(past.weight);
  }
  var week=entries.slice(0,7);
  function avg(field){var v=week.filter(function(e){return e[field]!=='';});if(!v.length)return null;var s=0;v.forEach(function(e){s+=parseFloat(e[field])||0;});return Math.round(s/v.length);}
  var avgCal=avg('calories'),avgPro=avg('protein');
  var stats='<div class="statrow">'
    +'<div class="stat neu"><div class="sl">Current weight</div><div class="sv">'+(curW!==null?curW+' lb':'—')+'</div></div>'
    +'<div class="stat '+(delta30===null?'neu':(delta30<=0?'good':'bad'))+'"><div class="sl">30-day change</div><div class="sv">'+(delta30===null?'—':(delta30>0?'+':'')+delta30.toFixed(1)+' lb')+'</div></div>'
    +'<div class="stat neu"><div class="sl">To target ('+tw+' lb)</div><div class="sv">'+(curW!==null?(curW>tw?'-':'+')+Math.abs(curW-tw).toFixed(1)+' lb':'—')+'</div></div>'
    +'</div><div class="statrow">'
    +'<div class="stat neu"><div class="sl">Avg calories / day (7d)</div><div class="sv">'+(avgCal===null?'—':avgCal)+'</div></div>'
    +'<div class="stat neu"><div class="sl">Avg protein / day (7d)</div><div class="sv">'+(avgPro===null?'—':avgPro+'g')+'</div></div>'

function fFood(id){return (state.health.foods||[]).filter(function(f){return f.id===id;})[0];}

var UNITS=['g','oz','lb','ml','l','cup','tbsp','tsp','slice','scoop','serving','bar','packet'];
var COUNTABLE_UNITS=['serving','scoop','slice','bar','packet'];
function isCountableUnit(u){return COUNTABLE_UNITS.indexOf(u)>-1;}
// units that read as abbreviations: no space before, never pluralized
var UNIT_ABBR=['g','kg','mg','oz','ml','l','lb'];
function trimNum(n){
  if(Math.abs(n)>=20)return String(Math.round(n));
  return n.toFixed(2).replace(/\.?0+$/,'');
}
function unitLabel(n,unit){
  var u=(unit||'g').trim()||'g';
  if(UNIT_ABBR.indexOf(u.toLowerCase())>-1)return u;
  return (n!==1&&!/s$/i.test(u))?u+'s':u;
}
function fmtQty(n,unit){
  var u=(unit||'g').trim()||'g';
  var v=trimNum(n);
  var lab=unitLabel(parseFloat(v),u);
  return UNIT_ABBR.indexOf(u.toLowerCase())>-1?v+lab:v+' '+lab;
}
function resolveFood(f,tmac,tamt,mult){
  // scale a food to hit `tamt` of `tmac`, then apply the meal multiplier (the bus fader)
  if(!f)return null;
  if(tamt===''||tamt===undefined||tamt===null)return null;
  var per=num(f[tmac||'protein']);if(per<=0)return null;
  var factor=(num(tamt)/per)*(mult===undefined?1:mult);
  return {grams:num(f.serving)*factor,calories:num(f.calories)*factor,protein:num(f.protein)*factor,carbs:num(f.carbs)*factor,fat:num(f.fat)*factor};
}
function resolveFoodQty(f,qty){
  // countable units (serving/scoop/slice/bar/packet) skip the macro-target math entirely —
  // you're not dialing in a macro, you're just saying how many you're having
  if(!f)return null;
  if(qty===''||qty===undefined||qty===null)return null;
  var base=num(f.serving)||1;
  var factor=num(qty)/base;
  return {grams:num(f.serving)*factor,calories:num(f.calories)*factor,protein:num(f.protein)*factor,carbs:num(f.carbs)*factor,fat:num(f.fat)*factor};
}
function foodResolved(f){return isCountableUnit(f.unit)?resolveFoodQty(f,f.tamt):resolveFood(f,f.tmac,f.tamt,1);}
function foodOutHtml(f){

  if(per<=0)return '<div class="fcnote warn">'+esc(f.name)+' has no '+tk+' recorded — pick a different target.</div>';
  var r=foodResolved(f);
  return '<div class="fcout"><div class="fcbig">'+trimNum(r.grams)+'<span class="fcunit">'+esc(unitLabel(parseFloat(trimNum(r.grams)),f.unit))+'</span></div>'
    +'<div class="fcmacros">'

    +'<span'+(tk==='carbs'?' class="on"':'')+'>C '+r.carbs.toFixed(1)+'g</span>'
    +'<span'+(tk==='fat'?' class="on"':'')+'>F '+r.fat.toFixed(1)+'g</span>'

function fMeal(id){return (state.health.meals||[]).filter(function(m){return m.id===id;})[0];}

function defaultTarget(f){
  // start a newly added item at exactly one base serving, keyed off its biggest macro
  var opts=[['protein',num(f.protein)],['carbs',num(f.carbs)],['fat',num(f.fat)]];
  opts.sort(function(a,b){return b[1]-a[1];});
  if(opts[0][1]>0)return {tmac:opts[0][0],tamt:opts[0][1]};
  return {tmac:'calories',tamt:num(f.calories)};
}
function mealTotals(m){
  var mult=num(m.mult)||1,t={calories:0,protein:0,carbs:0,fat:0};
  (m.items||[]).forEach(function(mi){

    if(r){t.calories+=r.calories;t.protein+=r.protein;t.carbs+=r.carbs;t.fat+=r.fat;}
  });

function logMeal(id){
  var m=fMeal(id);if(!m)return;
  var mult=num(m.mult)||1,gid=uid(),any=false;
  (m.items||[]).forEach(function(mi){
    var f=fFood(mi.foodId);if(!f)return;

function syncTodayMacros(){
  // the food log is the source of truth for today's calories/protein once anything is logged
  var today=todayStr(),rows=logFor(today);
  if(!rows.length)return;

function macroPieHtml(){

      +'<title>'+s.lab+': '+Math.round(s.kcal)+' cal · '+Math.round(pct)+'%</title></circle>';

// barcode scanner — runs outside the normal render() cycle (it manages its own
// overlay+camera element directly) since a re-render would tear down the video
// feed mid-scan. Nutrition lookup uses Open Food Facts, no key required.
async function lookupBarcode(code){
  var res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');
  if(!res.ok)throw new Error('lookup failed');
  var data=await res.json();
  if(data.status!==1||!data.product)return null;
  var p=data.product,n=p.nutriments||{};
  var name=p.product_name||p.generic_name||('Product '+code);
  var servingG=parseFloat(p.serving_quantity);
  // serving_quantity isn't always grams — drinks report it in ml (e.g. Monster: 500 "ml"), and
  // treating that as grams produced nonsense like "473.176g". Only trust it when explicitly grams.
  var servingUnitIsGrams=(p.serving_quantity_unit||'').toLowerCase()==='g';
  var hasServingG=servingUnitIsGrams&&!isNaN(servingG)&&servingG>0;
  var has100g=n['energy-kcal_100g']!==undefined||n.proteins_100g!==undefined||n.carbohydrates_100g!==undefined||n.fat_100g!==undefined;
  var hasServingNutrients=n['energy-kcal_serving']!==undefined||n.proteins_serving!==undefined||n.carbohydrates_serving!==undefined||n.fat_serving!==undefined;
  if(!has100g&&!hasServingNutrients)return null;
  if(hasServingG&&hasServingNutrients){
    // real label serving size (e.g. "40g" for oats) with matching per-serving nutrients — use as printed
    return {name:name,serving:servingG,unit:'g',
      calories:Math.round(num(n['energy-kcal_serving'])),protein:num(n.proteins_serving),carbs:num(n.carbohydrates_serving),fat:num(n.fat_serving)};
  }
  if(hasServingG&&has100g){
    // known serving weight but no precomputed per-serving figures — scale the 100g numbers ourselves
    var f=servingG/100;
    return {name:name,serving:servingG,unit:'g',
      calories:Math.round(num(n['energy-kcal_100g'])*f),protein:num(n.proteins_100g)*f,carbs:num(n.carbohydrates_100g)*f,fat:num(n.fat_100g)*f};
  }
  if(hasServingNutrients){
    // per-serving nutrients exist but no gram weight given — don't invent a weight, call it 1 serving
    return {name:name,serving:1,unit:'serving',
      calories:Math.round(num(n['energy-kcal_serving'])),protein:num(n.proteins_serving),carbs:num(n.carbohydrates_serving),fat:num(n.fat_serving)};
  }
  // only 100g data, no serving info at all — same idea, present as 1 serving rather than a specific gram guess
  return {name:name,serving:1,unit:'serving',
    calories:Math.round(num(n['energy-kcal_100g'])),protein:num(n.proteins_100g),carbs:num(n.carbohydrates_100g),fat:num(n.fat_100g)};
}

// events
// iOS Safari only simulates :active state on a sustained touch, not a quick
// tap, unless some element on the page has a touchstart listener. This one
// does nothing itself — its only job is to turn that behavior on so the
// button press-pop animation actually plays on a normal tap.
document.addEventListener('touchstart',function(){},{passive:true});
// Web Audio, not <audio>: HTMLMediaElement playback (even pooled/preloaded)
// re-seeks and re-primes its pipeline on every play(), which on mobile shows
// up as ~1s of audible lag behind the tap. Decoding once into an AudioBuffer
// and firing a fresh BufferSourceNode per tap plays with ~0 latency instead.
var POP_SRC='Sounds/Life%20System%20Sounds%20-%20Pop.wav';
var POP_CTX=null,POP_BUFFER=null;
function loadPop(){
  if(POP_CTX)return;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  POP_CTX=new AC();
  fetch(POP_SRC).then(function(r){return r.arrayBuffer();})
    .then(function(buf){return POP_CTX.decodeAudioData(buf);})
    .then(function(decoded){POP_BUFFER=decoded;})
    .catch(function(){});
}
// Must be born inside a real user gesture — iOS "Add to Home Screen" standalone
// mode won't unlock an AudioContext created ahead of time, even with resume()
// called later from a click. The earliest possible touch on the page creates
// it; playPop also calls this defensively in case that listener hasn't fired.
document.addEventListener('pointerdown',loadPop,{once:true,passive:true});
function playPop(){
  if(state.settings&&state.settings.sound===false)return;
  loadPop();
  if(!POP_CTX||!POP_BUFFER)return;
  if(POP_CTX.state==='suspended')POP_CTX.resume();
  var vol=(state.settings&&state.settings.volume!=null)?state.settings.volume:70;
  var src=POP_CTX.createBufferSource();
  var gain=POP_CTX.createGain();
  gain.gain.value=vol/100;
  src.buffer=POP_BUFFER;
  src.connect(gain).connect(POP_CTX.destination);
  src.start(0);
}

    var rc=fR(t.dataset.id);
    if(rc){
      var k=dkey(todayDate());rc.dates=rc.dates||[];var idx=rc.dates.indexOf(k);
      if(idx>-1){rc.dates.splice(idx,1);save();render();}
      else if(checkinGate(rc)==='open'){rc.dates.push(k);save();render();}
    }
  }
  else if(a==='hdel'){state.health.entries=(state.health.entries||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='openfoodadd'){foodAddOpen=true;render();}
  else if(a==='closefoodadd'){foodAddOpen=false;render();}
  else if(a==='foodadd'){addFood();}
  else if(a==='scanbarcode'){openScanner();}
  else if(a==='fooddel'){state.health.foods=(state.health.foods||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='foodlog'){addFoodLog(t.dataset.id);}
  else if(a==='logdel'){state.health.log=(state.health.log||[]).filter(function(x){return x.id!==t.dataset.id;});syncTodayMacros();save();render();}
  else if(a==='logdelgroup'){state.health.log=(state.health.log||[]).filter(function(x){return x.gid!==t.dataset.gid;});syncTodayMacros();save();render();}
  else if(a==='openmealadd'){mealAddOpen=true;render();}
  else if(a==='closemealadd'){mealAddOpen=false;render();}
  else if(a==='addmeal'){addMeal();}
  else if(a==='dmeal'){state.health.meals=(state.health.meals||[]).filter(function(x){return x.id!==t.dataset.id;});save();render();}
  else if(a==='emln'){state.editing='ml:'+t.dataset.id;render();}
  else if(a==='logmeal'){logMeal(t.dataset.id);}
  else if(a==='midel'){var dm=fMeal(t.dataset.mid);if(dm){dm.items=(dm.items||[]).filter(function(x){return x.id!==t.dataset.iid;});save();render();}}
});

function addTodo(forcedSub){
  var ti=app.querySelector('[data-a="tdnew"]');if(!ti)return;
  var v=ti.value.trim();if(!v)return;
  var se=app.querySelector('[data-a="tdnewsub"]');
  var sid=forcedSub||(se?se.value:'')||'';
  state.todos=state.todos||[];
  state.todos.push({id:uid(),text:v,subId:sid,priority:false,done:false});
  save();render();
}
function addSub(gid,inp){if(!inp)return;var v=inp.value.trim();if(!v)return;fG(gid).subgoals.push({id:'sg_'+uid(),title:v,note:'',steps:[]});save();render();}
function addRoutine(){var ti=app.querySelector('[data-a="rtn"]'),ge=app.querySelector('[data-a="rtg"]');if(!ti)return;var tv=ti.value.trim();if(!tv)return;state.routines.push({id:'r_'+uid(),goalId:ge?ge.value:null,title:tv,cadence:'daily',active:true,note:'',blocks:[]});save();render();}
function findBlock(rid,bid){var r=fR(rid);if(!r||!r.blocks)return null;return r.blocks.filter(function(b){return b.id===bid;})[0]||null;}
function toggleDay2(rid,bid,day){var b=findBlock(rid,bid);if(!b)return;b.days=b.days||[];var i=b.days.indexOf(day);if(i<0)b.days.push(day);else b.days.splice(i,1);save();render();}
function setBlockTime2(rid,bid,which,val){var b=findBlock(rid,bid);if(!b)return;b[which]=val;save();render();}

app.addEventListener('keydown',function(e){var t=e.target,a=t.dataset&&t.dataset.a;
  if(e.key==='Enter'){
    if(a==='tdnew'){e.preventDefault();addTodo(t.closest('.tdadd')&&t.closest('.tdadd').querySelector('[data-a="tdaddbtn"]')?t.closest('.tdadd').querySelector('[data-a="tdaddbtn"]').dataset.sub||null:null);}
    else if(a==='subi'){e.preventDefault();addSub(t.dataset.g,t);}
    else if(a==='rtn'){e.preventDefault();addRoutine();}
    else if(a==='fnew'){e.preventDefault();addFood();}
    else if(a==='mealn'){e.preventDefault();addMeal();}
    else if(['cgt','cst','tdcommit','crtn','crcd','cmln'].indexOf(a)>-1){e.preventDefault();t.blur();}
  }else if(e.key==='Escape'){state.editing=null;render();}
});
app.addEventListener('input',function(e){var t=e.target,a=t.dataset&&t.dataset.a;
  if(a==='setrange'){state.settings[t.dataset.k]=parseInt(t.value,10);save();return;}
  if(a==='fin'){if(t.type==='date'){state.finance[t.dataset.k]=t.value;save();refreshFin();return;}var v=t.value===''?'':parseFloat(t.value);state.finance[t.dataset.k]=isNaN(v)?'':v;save();refreshFin();return;}
  if(a==='finl'){var ky=t.dataset.t==='inc'?'income':'expenses';var it=(state.finance[ky]||[]).filter(function(x){return x.id===t.dataset.id;})[0];
    if(it){if(t.dataset.f==='amt'){var nv=t.value===''?'':parseFloat(t.value);it.amt=isNaN(nv)?'':nv;}else it.name=t.value;save();refreshFin();}return;}
  if(a==='hfield'){var v=t.value;var fv=t.type==='number'?(v===''?'':parseFloat(v)):v;upsertHealth(todayStr(),t.dataset.field,fv);save();refreshHealth();return;}
  if(a==='hedit'){var he=(state.health.entries||[]).filter(function(x){return x.id===t.dataset.id;})[0];if(he){var v2=t.value;he[t.dataset.field]=t.type==='number'?(v2===''?'':parseFloat(v2)):v2;save();refreshHealth();}return;}
  if(a==='foodamt'){var fd=fFood(t.dataset.id);if(fd){fd.tamt=t.value;save();refreshFoodCard(fd.id);}return;}
  if(a==='mealmult'){var mm=fMeal(t.dataset.id);if(mm){mm.mult=t.value===''?'':parseFloat(t.value);save();refreshMeal(mm.id);}return;}
  if(a==='mitemamt'){
    var im=fMeal(t.dataset.mid);
    if(im){var it=(im.items||[]).filter(function(x){return x.id===t.dataset.iid;})[0];if(it){it.tamt=t.value;save();refreshMeal(im.id);}}
    return;
  }
  if(a==='foodsearch'){
    // filter in the DOM rather than re-rendering, so typing doesn't lose focus
    var q=t.value.trim().toLowerCase();
    var cards=app.querySelectorAll('#foodlist .fcard');
    for(var ci=0;ci<cards.length;ci++){
      var nm=cards[ci].getAttribute('data-name')||'';
      cards[ci].style.display=(!q||nm.indexOf(q)>-1)?'':'none';
    }
    return;
  }
  return;});
app.addEventListener('change',function(e){var t=e.target,a=t.dataset&&t.dataset.a;
  if(t.id==='importfile'){handleImportFile(t.files&&t.files[0]);return;}
  if(a==='setfield'){state.settings[t.dataset.k]=t.value;save();return;}
  if(a==='fnew'&&t.dataset.f==='unit'){
    // switching to a countable unit (scoop/slice/bar/packet/serving) mid-entry — the macros
    // already scanned/typed represent whatever the old serving was, so just re-anchor the
    // serving number to 1 rather than leaving a stale "30" sitting next to "scoop"
    if(isCountableUnit(t.value)){
      var servingInput=app.querySelector('[data-a="fnew"][data-f="serving"]');
      if(servingInput)servingInput.value='1';
    }
    return;
  }
  if(a==='fin'&&t.type==='date'){state.finance[t.dataset.k]=t.value;save();refreshFin();return;}
  if(a==='btime2'){setBlockTime2(t.dataset.rid,t.dataset.bid,t.dataset.which,t.value);return;}
  if(a==='sleepset'){state.sleep[t.dataset.k]=t.value;save();render();return;}
  if(a==='tdsub'){var td=(state.todos||[]).filter(function(x){return x.id===t.dataset.id;})[0];if(td){td.subId=t.value;save();render();}return;}
  if(a==='rtgoal'){var r=fR(t.dataset.id);if(r){r.goalId=t.value||null;save();render();}}
  if(a==='foodmac'){var fd=fFood(t.dataset.id);if(fd){fd.tmac=t.value;save();refreshFoodCard(fd.id);}}
  if(a==='mitemmac'){
    var mmc=fMeal(t.dataset.mid);
    if(mmc){var mit=(mmc.items||[]).filter(function(x){return x.id===t.dataset.iid;})[0];if(mit){mit.tmac=t.value;save();refreshMeal(mmc.id);}}
    return;
  }
  if(a==='mealadditem'){
    var am=fMeal(t.dataset.id),af=fFood(t.value);
    if(am&&af){var d=defaultTarget(af);am.items=am.items||[];am.items.push({id:uid(),foodId:af.id,tmac:d.tmac,tamt:d.tamt});save();render();}
    else t.value='';
    return;
  }
});
app.addEventListener('blur',function(e){var t=e.target,a=t.dataset&&t.dataset.a;if(!a)return;
  if(a==='cgt'){var g=fG(t.dataset.g);var v=t.value.trim();if(v)g.title=v;state.editing=null;save();render();}
  else if(a==='cst'){var sb=curSub();var v2=t.value.trim();if(v2)sb.title=v2;state.editing=null;save();render();}
  else if(a==='tdcommit'){var td=(state.todos||[]).filter(function(x){return x.id===t.dataset.id;})[0];var v3=t.value.trim();if(td){if(v3)td.text=v3;else state.todos=state.todos.filter(function(x){return x.id!==t.dataset.id;});}state.editing=null;save();render();}
  else if(a==='cnote'){var sb2=curSub();if(sb2){sb2.note=t.value;save();}}
  else if(a==='crtn'){var r=fR(t.dataset.id);var rv=t.value.trim();if(rv)r.title=rv;state.editing=null;save();render();}
  else if(a==='crcd'){var r2=fR(t.dataset.id);r2.cadence=t.value.trim()||r2.cadence;state.editing=null;save();render();}
  else if(a==='crtn2'){var r3=fR(t.dataset.id);if(r3){r3.note=t.value;save();}}
  else if(a==='cmln'){var ml=fMeal(t.dataset.id);var mv=t.value.trim();if(ml&&mv)ml.name=mv;state.editing=null;save();render();}
},true);

(async function(){state=await loadState();UNDO.push(JSON.stringify(state));render();})();
})();
</script>
